<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi - Administración</title>
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="icon-192.png">
<style>
:root{
 --primary:#1e88e5;--bg:#f2f4f8;--card:#fff;
 --text:#1f2937;--muted:#6b7280;
 --shadow:0 10px 25px rgba(0,0,0,.12);
 --radius:18px;
}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
header{
 background:linear-gradient(135deg,#1e88e5,#1565c0);
 color:#fff;padding:20px;text-align:center;
 position:sticky;top:0;z-index:100
}
button{
 background:var(--primary);color:#fff;border:none;
 padding:10px 16px;border-radius:14px;font-weight:700;
 cursor:pointer;
 transition:opacity 0.3s;
}
button:hover{opacity:0.9}
button.secondary{
 background:#6b7280;
}
#night{position:fixed;top:12px;right:12px;z-index:200}
.nav{display:flex;justify-content:space-between;padding:10px}
.container{max-width:960px;margin:auto;padding:10px}
.carousel{
 display:flex;gap:14px;overflow-x:auto;
 scroll-snap-type:x mandatory;
 padding-bottom:10px;
}
.card{
 min-width:320px;background:var(--card);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 padding:20px;scroll-snap-align:center;
 position:relative;
}
.guardias{display:flex;gap:14px;margin-top:14px}
.guardia{
 flex:1;text-align:center;
 background:rgba(0,0,0,.05);
 border-radius:14px;padding:14px;
 position:relative;
}
body.dark .guardia{background:rgba(255,255,255,.06)}
.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted)}
.time{font-weight:700;font-size:.9em}
.status-active{color:#10b981}
.status-vacaciones{color:#f59e0b}
.status-viaje{color:#8b5cf6}
.status-baja{color:#ef4444}
.status-inactivo{color:#6b7280}

/* ===== CALENDARIO ===== */
#calendar{
 margin:20px;background:var(--card);
 border-radius:var(--radius);padding:16px
}
.calendar-head{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 font-size:.7rem;
 font-weight:700;
 color:var(--muted);
 text-align:center;
 margin-top:8px
}
.calendar-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px;
 margin-top:10px
}
.calendar-day{
 font-size:.7rem;text-align:center;
 padding:6px;border-radius:8px;
 background:rgba(0,0,0,.04);
 min-height:70px;
 display:flex;
 flex-direction:column;
 justify-content:flex-start;
}
.day-number{
 font-weight:bold;
 margin-bottom:3px;
}
.weekday{background:rgba(30,136,229,.08);cursor:pointer}
.weekend{background:rgba(0,0,0,.02);color:var(--muted)}
.today-week{outline:2px solid var(--primary)}
body.dark .weekday{background:rgba(30,136,229,.18)}
body.dark .weekend{background:rgba(255,255,255,.03)}
.calendar-day.outside{
 background:rgba(0,0,0,.02);color:var(--muted)
}
.guardia-info{
 font-size:9px;
 line-height:1.2;
 margin-top:2px;
}

/* ===== ADMIN ===== */
details{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.admin-section{
 margin-bottom:30px;
 padding:15px;
 background:rgba(0,0,0,.02);
 border-radius:12px;
}
.admin-person{
 display:flex;justify-content:space-between;
 align-items:center;
 border-bottom:1px solid rgba(0,0,0,.1);
 padding:10px 0;
 gap:10px;
 flex-wrap:wrap;
}
.admin-person .name{
 flex:1;
 min-width:120px;
 font-weight:600;
}
select{
 border-radius:10px;
 padding:6px 10px;
 border:1px solid #ddd;
 background:var(--card);
 color:var(--text);
 font-size:14px;
 min-width:140px;
}

/* ===== MANEJO DE GUARDIAS ===== */
.week-controls{
 display:flex;
 gap:10px;
 align-items:center;
 margin:15px 0;
}
.week-number{
 font-weight:bold;
 color:var(--primary);
}
.week-guard{
 background:rgba(30,136,229,.1);
 padding:8px 15px;
 border-radius:10px;
 margin:5px 0;
}
.week-guard select{
 min-width:120px;
}
.move-buttons{
 display:flex;
 gap:5px;
 margin-top:5px;
}
.move-buttons button{
 padding:4px 8px;
 font-size:12px;
}

/* ===== HISTORIAL ===== */
#history{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.history-item{
 font-size:.9em;border-bottom:1px dashed rgba(0,0,0,.2);
 padding:6px 0
}

/* ===== MODAL ===== */
.modal{
 display:none;
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:rgba(0,0,0,0.5);
 z-index:1000;
 align-items:center;
 justify-content:center;
}
.modal-content{
 background:var(--card);
 padding:25px;
 border-radius:var(--radius);
 max-width:500px;
 width:90%;
 max-height:80vh;
 overflow-y:auto;
}
.modal-buttons{
 display:flex;
 gap:10px;
 justify-content:flex-end;
 margin-top:20px;
}

@media(max-width:480px){
 .calendar-day{font-size:.6rem;min-height:60px}
 .admin-person{flex-direction:column;align-items:flex-start}
 .admin-person .name{min-width:auto}
 select{min-width:100%}
 .modal-content{width:95%;padding:15px;}
 .guardia-info{font-size:8px}
}
</style>
</head>
<body>
<button id="night">🌙</button>
<header>
<h1>Guardias Alsi - Administración</h1>
<div id="subtitle"></div>
</header>
<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>
<div class="container">
<div class="carousel" id="carousel"></div>
</div>
<div id="calendar">
<div style="display:flex;justify-content:space-between;align-items:center">
<button onclick="changeMonth(-1)">◀</button>
<h3 id="calendarTitle"></h3>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<details id="admin">
<summary>⚙️ Administrador</summary>
<div id="admin-content">
 <div class="admin-section">
  <h3>⚡ Estado de Personas</h3>
  <h4>Eléctricos</h4>
  <div id="admin-elec"></div>
  <h4>Mecánicos</h4>
  <div id="admin-mec"></div>
 </div>
 
 <div class="admin-section">
  <h3>🔄 Mover Guardias</h3>
  <p>Selecciona una semana y cambia las guardias manualmente:</p>
  <div class="week-controls">
   <button onclick="changeAdminWeek(-1)">◀ Semana anterior</button>
   <span id="admin-week-title" class="week-number"></span>
   <button onclick="changeAdminWeek(1)">Semana siguiente ▶</button>
  </div>
  <div id="admin-guardias"></div>
  <button onclick="saveManualChanges()" style="margin-top:15px">💾 Guardar cambios manuales</button>
 </div>
 
 <div class="admin-section">
  <h3>⚙️ Intercambiar Personas</h3>
  <p>Intercambia a dos personas en el calendario:</p>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
   <select id="swap-person1">
    <option value="">Selecciona persona 1</option>
   </select>
   <span>↔</span>
   <select id="swap-person2">
    <option value="">Selecciona persona 2</option>
   </select>
   <button onclick="swapPersons()" class="secondary">🔄 Intercambiar</button>
  </div>
 </div>
 
 <br><button id="save">💾 Guardar Todo</button>
 <button onclick="resetToDefault()" class="secondary" style="margin-left:10px;">🔄 Reiniciar a Rotación Automática</button>
</div>
</details>

<div id="history">
<h3>📜 Historial real</h3>
<div id="historyList"></div>
</div>

<!-- Modal para editar guardia -->
<div id="editModal" class="modal">
<div class="modal-content">
 <h3>✏️ Editar Guardia</h3>
 <div id="modal-week-info"></div>
 <div style="margin:15px 0;">
  <label for="edit-electrico"><strong>⚡ Eléctrico:</strong></label>
  <select id="edit-electrico" style="width:100%;margin-top:5px;"></select>
 </div>
 <div style="margin:15px 0;">
  <label for="edit-mecanico"><strong>🔧 Mecánico:</strong></label>
  <select id="edit-mecanico" style="width:100%;margin-top:5px;"></select>
 </div>
 <div class="modal-buttons">
  <button onclick="closeModal()">Cancelar</button>
  <button onclick="applyGuardiaEdit()">Guardar Cambios</button>
 </div>
</div>
</div>

<script>
// ========== CÓDIGO CORREGIDO PARA EL CALENDARIO ==========
// Toggle modo oscuro
night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
};
if(localStorage.dark==="true") document.body.classList.add("dark");

// Contraseña admin
const ADMIN_PASS="alsi2026";
let adminAuthenticated = false;
let adminWeekOffset = 0;
let manualOverrides = JSON.parse(localStorage.manualOverrides || "{}");
let editModalWeek = 0;

// Datos iniciales
let electricos=["Fran Ruiz","Hicham","Jose","Abde","Dani","Fran"];
let mecanicos=["Ramon","Traian","Manu","Fran Alba","Cele","Santy"];
let estados=JSON.parse(localStorage.estados||"{}");
let history=JSON.parse(localStorage.history||"[]");
let offset=0;
let calendarMonth=new Date();

// ========== FUNCIONES CORREGIDAS (IGUAL QUE EN INDEX) ==========
// FECHA BASE FIJA: Lunes 1 de Enero de 2024
const FECHA_BASE = new Date(2024, 0, 1);
const MS_POR_SEMANA = 7 * 24 * 60 * 60 * 1000;

// Función para obtener el lunes de cualquier semana
function obtenerLunes(fecha) {
  const d = new Date(fecha);
  const dia = d.getDay();
  const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}

// Función para calcular número de semana desde fecha base
function calcularNumeroSemana(fecha) {
  const fechaLunes = obtenerLunes(fecha);
  fechaLunes.setHours(12, 0, 0, 0);
  
  const fechaBaseLunes = obtenerLunes(FECHA_BASE);
  fechaBaseLunes.setHours(12, 0, 0, 0);
  
  const diferenciaMs = fechaLunes - fechaBaseLunes;
  const numeroSemana = Math.floor(diferenciaMs / MS_POR_SEMANA);
  
  return numeroSemana;
}

// Función para formatear fecha
const fd = d => {
  const date = new Date(d);
  return date.toLocaleDateString('es-ES', {
    day: '2-digit',
    month: '2-digit'
  });
};

// Obtener lista de activos
const activos = l => l.filter(p => !estados[p] || estados[p] === "activo");

// Obtener guardia para una semana específica
const guardia = (l, numeroSemana) => {
  const a = activos(l);
  if (a.length === 0) return "Nadie";
  
  // Verificar override manual primero
  const semanaKey = numeroSemana.toString();
  if (manualOverrides[semanaKey]) {
    const tipo = l === electricos ? 'electrico' : 'mecanico';
    if (manualOverrides[semanaKey][tipo]) {
      return manualOverrides[semanaKey][tipo];
    }
  }
  
  // Rotación automática
  const indice = ((numeroSemana % a.length) + a.length) % a.length;
  return a[indice];
};

// ========== AUTENTICACIÓN ADMIN ==========
function checkAdminAuth() {
 if (!adminAuthenticated) {
  const password = prompt("🔐 Contraseña administrador:");
  if (password === ADMIN_PASS) {
   adminAuthenticated = true;
   document.getElementById('admin-content').style.display = 'block';
   renderAdmin();
   renderAdminGuardias();
   populateSwapSelects();
  } else {
   document.getElementById('admin-content').style.display = 'none';
   document.querySelector('#admin summary').textContent = '🔒 Administrador (acceso restringido)';
  }
 }
}

// ========== ADMIN: RENDERIZAR ESTADOS ==========
function renderAdmin(){
 let adminElecHTML = '';
 electricos.forEach(persona=>{
  const estadoActual = estados[persona] || 'activo';
  adminElecHTML += `
   <div class="admin-person">
    <div class="name">${persona}</div>
    <select id="estado-${persona.replace(/\s+/g, '-')}" onchange="estados['${persona}']=this.value; updatePersonStatus('${persona}', this.value)">
     <option value="activo" ${estadoActual==='activo'?'selected':''}>✅ Activo</option>
     <option value="vacaciones" ${estadoActual==='vacaciones'?'selected':''}>🏖️ Vacaciones</option>
     <option value="viaje" ${estadoActual==='viaje'?'selected':''}>✈️ Viaje</option>
     <option value="baja" ${estadoActual==='baja'?'selected':''}>🤒 Baja médica</option>
     <option value="inactivo" ${estadoActual==='inactivo'?'selected':''}>⏸️ Inactivo</option>
    </select>
    <span class="status-${estadoActual}">${getEstadoTexto(estadoActual)}</span>
   </div>
  `;
 });
 document.getElementById('admin-elec').innerHTML = adminElecHTML;
 
 let adminMecHTML = '';
 mecanicos.forEach(persona=>{
  const estadoActual = estados[persona] || 'activo';
  adminMecHTML += `
   <div class="admin-person">
    <div class="name">${persona}</div>
    <select id="estado-${persona.replace(/\s+/g, '-')}" onchange="estados['${persona}']=this.value; updatePersonStatus('${persona}', this.value)">
     <option value="activo" ${estadoActual==='activo'?'selected':''}>✅ Activo</option>
     <option value="vacaciones" ${estadoActual==='vacaciones'?'selected':''}>🏖️ Vacaciones</option>
     <option value="viaje" ${estadoActual==='viaje'?'selected':''}>✈️ Viaje</option>
     <option value="baja" ${estadoActual==='baja'?'selected':''}>🤒 Baja médica</option>
     <option value="inactivo" ${estadoActual==='inactivo'?'selected':''}>⏸️ Inactivo</option>
    </select>
    <span class="status-${estadoActual}">${getEstadoTexto(estadoActual)}</span>
   </div>
  `;
 });
 document.getElementById('admin-mec').innerHTML = adminMecHTML;
}

function getEstadoTexto(estado){
 switch(estado){
  case 'activo': return 'Activo';
  case 'vacaciones': return 'Vacaciones';
  case 'viaje': return 'Viaje';
  case 'baja': return 'Baja';
  case 'inactivo': return 'Inactivo';
  default: return 'Activo';
 }
}

function updatePersonStatus(persona, estado) {
 estados[persona] = estado;
 render();
 renderCalendar();
 renderAdminGuardias();
}

// ========== CALENDARIO CORREGIDO ==========
function renderCalendar() {
  calendarGrid.innerHTML = "";
  const y = calendarMonth.getFullYear();
  const m = calendarMonth.getMonth();
  
  calendarTitle.textContent = `📆 ${calendarMonth.toLocaleString("es", { month: "long" })}, ${y}`;
  
  const primerDia = new Date(y, m, 1);
  const ultimoDia = new Date(y, m + 1, 0);
  
  const inicio = new Date(primerDia);
  const diaSemana = inicio.getDay();
  const diasAtras = diaSemana === 0 ? 6 : diaSemana - 1;
  inicio.setDate(inicio.getDate() - diasAtras);
  
  const fin = new Date(ultimoDia);
  const diaSemanaFin = fin.getDay();
  const diasAdelante = diaSemanaFin === 0 ? 0 : 7 - diaSemanaFin;
  fin.setDate(fin.getDate() + diasAdelante);
  
  let fechaActual = new Date(inicio);
  while (fechaActual <= fin) {
    const esMesAnterior = fechaActual.getMonth() < m;
    const esMesSiguiente = fechaActual.getMonth() > m;
    const esFueraMes = esMesAnterior || esMesSiguiente;
    const diaSemana = fechaActual.getDay();
    const esDiaLaboral = diaSemana >= 1 && diaSemana <= 5;
    
    const numeroSemana = calcularNumeroSemana(fechaActual);
    const elecGuardia = guardia(electricos, numeroSemana);
    const mecGuardia = guardia(mecanicos, numeroSemana);
    const tieneOverride = manualOverrides[numeroSemana.toString()];
    
    let contenidoHTML = `
      <div class="day-number">${fechaActual.getDate()}</div>
    `;
    
    if (esDiaLaboral && !esFueraMes) {
      contenidoHTML += `
        <div class="guardia-info">
          <div class="${tieneOverride ? 'status-viaje' : 'status-active'}">⚡ ${elecGuardia}</div>
          <div class="${tieneOverride ? 'status-viaje' : 'status-active'}">🔧 ${mecGuardia}</div>
        </div>
      `;
    }
    
    const clases = [
      'calendar-day',
      esFueraMes ? 'outside' : '',
      esDiaLaboral ? 'weekday' : 'weekend'
    ].filter(c => c).join(' ');
    
    // En admin, los días laborables son clickeables
    const onClick = esDiaLaboral && !esFueraMes ? 
      `onclick="offset=${calcularNumeroSemana(fechaActual) - calcularNumeroSemana(new Date())};render()"` : '';
    
    calendarGrid.innerHTML += `
      <div class="${clases}" ${onClick}>
        ${contenidoHTML}
      </div>
    `;
    
    fechaActual.setDate(fechaActual.getDate() + 1);
  }
}

function changeMonth(delta) {
  calendarMonth.setMonth(calendarMonth.getMonth() + delta);
  renderCalendar();
}

// ========== RENDERIZAR SEMANAS ==========
function render() {
  carousel.innerHTML = "";
  const hoy = new Date();
  const numeroSemanaActual = calcularNumeroSemana(hoy);
  
  const fechaBase = obtenerLunes(hoy);
  fechaBase.setDate(fechaBase.getDate() + (offset * 7));
  
  const fechaInicio = new Date(fechaBase);
  const fechaFin = new Date(fechaInicio);
  fechaFin.setDate(fechaFin.getDate() + 4);
  
  subtitle.textContent = `${fd(fechaInicio)} - ${fd(fechaFin)}`;
  
  for (let i = -1; i <= 1; i++) {
    const semanaOffset = offset + i;
    const numeroSemana = numeroSemanaActual + semanaOffset;
    
    const semanaInicio = new Date(fechaBase);
    semanaInicio.setDate(semanaInicio.getDate() + (i * 7));
    const semanaFin = new Date(semanaInicio);
    semanaFin.setDate(semanaFin.getDate() + 4);
    
    const elecGuardia = guardia(electricos, numeroSemana);
    const mecGuardia = guardia(mecanicos, numeroSemana);
    const tieneOverride = manualOverrides[numeroSemana.toString()];
    
    carousel.innerHTML += `
      <div class="card">
        <h3>${fd(semanaInicio)} - ${fd(semanaFin)} ${tieneOverride ? '🔄' : ''}</h3>
        <div class="guardias">
          <div class="guardia">
            <div class="icono">⚡</div>
            <div class="nombre">${elecGuardia}</div>
            <div class="days">L–V</div>
            <div class="time">15:30 – 19:00</div>
            <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">
              ${getEstadoTexto(estados[elecGuardia])}
            </small>
          </div>
          <div class="guardia">
            <div class="icono">🔧</div>
            <div class="nombre">${mecGuardia}</div>
            <div class="days">L–V</div>
            <div class="time">15:30 – 19:00</div>
            <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">
              ${getEstadoTexto(estados[mecGuardia])}
            </small>
          </div>
        </div>
      </div>
    `;
  }
  
  renderHistory();
  
  requestAnimationFrame(() => {
    if (carousel.children[1]) {
      carousel.scrollLeft = carousel.children[1].offsetLeft - 14;
    }
  });
}

// ========== ADMIN: GESTIÓN DE GUARDIAS ==========
function renderAdminGuardias() {
  const hoy = new Date();
  const numeroSemanaActual = calcularNumeroSemana(hoy);
  const semanaAdmin = numeroSemanaActual + adminWeekOffset;
  
  const fechaInicio = obtenerLunes(hoy);
  fechaInicio.setDate(fechaInicio.getDate() + adminWeekOffset * 7);
  const fechaFin = new Date(fechaInicio);
  fechaFin.setDate(fechaFin.getDate() + 4);
  
  document.getElementById('admin-week-title').textContent = 
    `Semana ${semanaAdmin}: ${fd(fechaInicio)} - ${fd(fechaFin)}`;
  
  const semanaKey = semanaAdmin.toString();
  const override = manualOverrides[semanaKey] || {};
  
  let html = `
    <div class="week-guard">
     <strong>⚡ Guardia eléctrica:</strong>
     <select id="admin-elec-${semanaAdmin}" style="margin-left:10px;">
      <option value="">-- Rotación automática --</option>
      ${activos(electricos).map(p => 
       `<option value="${p}" ${override.electrico===p?'selected':''}>${p}</option>`
      ).join('')}
     </select>
     <div class="move-buttons">
      <button onclick="moveGuardia('electrico', -1)">⬅ Mover a semana anterior</button>
      <button onclick="moveGuardia('electrico', 1)">Mover a semana siguiente ➡</button>
     </div>
    </div>
    <div class="week-guard">
     <strong>🔧 Guardia mecánica:</strong>
     <select id="admin-mec-${semanaAdmin}" style="margin-left:10px;">
      <option value="">-- Rotación automática --</option>
      ${activos(mecanicos).map(p => 
       `<option value="${p}" ${override.mecanico===p?'selected':''}>${p}</option>`
      ).join('')}
     </select>
     <div class="move-buttons">
      <button onclick="moveGuardia('mecanico', -1)">⬅ Mover a semana anterior</button>
      <button onclick="moveGuardia('mecanico', 1)">Mover a semana siguiente ➡</button>
     </div>
    </div>
    <button onclick="openEditModal(${semanaAdmin})" style="margin-top:10px;">✏️ Editar ambas guardias</button>
  `;
  
  document.getElementById('admin-guardias').innerHTML = html;
}

function changeAdminWeek(delta) {
  adminWeekOffset += delta;
  renderAdminGuardias();
}

function moveGuardia(tipo, delta) {
  const hoy = new Date();
  const numeroSemanaActual = calcularNumeroSemana(hoy);
  const currentWeek = numeroSemanaActual + adminWeekOffset;
  const targetWeek = currentWeek + delta;
  
  const semanaKey = currentWeek.toString();
  const targetKey = targetWeek.toString();
  
  const selectId = `admin-${tipo}-${currentWeek}`;
  const select = document.getElementById(selectId);
  const selectedPerson = select.value;
  
  if (!selectedPerson) {
    alert(`Selecciona primero un ${tipo} para mover`);
    return;
  }
  
  if (!manualOverrides[targetKey]) {
    manualOverrides[targetKey] = {};
  }
  manualOverrides[targetKey][tipo] = selectedPerson;
  
  if (manualOverrides[semanaKey]) {
    delete manualOverrides[semanaKey][tipo];
    if (Object.keys(manualOverrides[semanaKey]).length === 0) {
      delete manualOverrides[semanaKey];
    }
  }
  
  localStorage.manualOverrides = JSON.stringify(manualOverrides);
  renderAdminGuardias();
  render();
  renderCalendar();
  alert(`${selectedPerson} movido a la semana ${targetWeek}`);
}

function saveManualChanges() {
  const hoy = new Date();
  const numeroSemanaActual = calcularNumeroSemana(hoy);
  const semanaAdmin = numeroSemanaActual + adminWeekOffset;
  const semanaKey = semanaAdmin.toString();
  
  const elecSelect = document.getElementById(`admin-elec-${semanaAdmin}`);
  const mecSelect = document.getElementById(`admin-mec-${semanaAdmin}`);
  
  const elecValue = elecSelect.value;
  const mecValue = mecSelect.value;
  
  if (!elecValue && !mecValue) {
    if (manualOverrides[semanaKey]) {
      delete manualOverrides[semanaKey];
    }
  } else {
    if (!manualOverrides[semanaKey]) {
      manualOverrides[semanaKey] = {};
    }
    if (elecValue) manualOverrides[semanaKey].electrico = elecValue;
    else delete manualOverrides[semanaKey].electrico;
    
    if (mecValue) manualOverrides[semanaKey].mecanico = mecValue;
    else delete manualOverrides[semanaKey].mecanico;
  }
  
  localStorage.manualOverrides = JSON.stringify(manualOverrides);
  render();
  renderCalendar();
  alert("✅ Cambios guardados");
}

// ========== INTERCAMBIO DE PERSONAS ==========
function populateSwapSelects() {
  const select1 = document.getElementById('swap-person1');
  const select2 = document.getElementById('swap-person2');
  
  select1.innerHTML = '<option value="">Selecciona persona 1</option>';
  select2.innerHTML = '<option value="">Selecciona persona 2</option>';
  
  [...activos(electricos), ...activos(mecanicos)].forEach(persona => {
    const option1 = new Option(persona, persona);
    const option2 = new Option(persona, persona);
    select1.add(option1);
    select2.add(option2);
  });
}

function swapPersons() {
  const persona1 = document.getElementById('swap-person1').value;
  const persona2 = document.getElementById('swap-person2').value;
  
  if (!persona1 || !persona2) {
    alert("Selecciona dos personas para intercambiar");
    return;
  }
  
  if (persona1 === persona2) {
    alert("Selecciona dos personas diferentes");
    return;
  }
  
  Object.keys(manualOverrides).forEach(weekKey => {
    const week = manualOverrides[weekKey];
    if (week.electrico === persona1) week.electrico = persona2;
    else if (week.electrico === persona2) week.electrico = persona1;
    
    if (week.mecanico === persona1) week.mecanico = persona2;
    else if (week.mecanico === persona2) week.mecanico = persona1;
  });
  
  localStorage.manualOverrides = JSON.stringify(manualOverrides);
  render();
  renderCalendar();
  renderAdminGuardias();
  alert(`✅ ${persona1} y ${persona2} intercambiados en todas las semanas`);
}

// ========== MODAL DE EDICIÓN ==========
function openEditModal(week) {
  editModalWeek = week;
  const hoy = new Date();
  const fechaInicio = obtenerLunes(hoy);
  fechaInicio.setDate(fechaInicio.getDate() + (week - calcularNumeroSemana(hoy)) * 7);
  const fechaFin = new Date(fechaInicio);
  fechaFin.setDate(fechaFin.getDate() + 4);
  
  document.getElementById('modal-week-info').innerHTML = 
    `<p><strong>Semana ${week}:</strong> ${fd(fechaInicio)} - ${fd(fechaFin)}</p>`;
  
  const elecSelect = document.getElementById('edit-electrico');
  elecSelect.innerHTML = '<option value="">-- Rotación automática --</option>';
  activos(electricos).forEach(p => {
    const option = new Option(p, p);
    elecSelect.add(option);
  });
  
  const mecSelect = document.getElementById('edit-mecanico');
  mecSelect.innerHTML = '<option value="">-- Rotación automática --</option>';
  activos(mecanicos).forEach(p => {
    const option = new Option(p, p);
    mecSelect.add(option);
  });
  
  const weekKey = week.toString();
  const override = manualOverrides[weekKey] || {};
  if (override.electrico) elecSelect.value = override.electrico;
  if (override.mecanico) mecSelect.value = override.mecanico;
  
  document.getElementById('editModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('editModal').style.display = 'none';
}

function applyGuardiaEdit() {
  const weekKey = editModalWeek.toString();
  const elecValue = document.getElementById('edit-electrico').value;
  const mecValue = document.getElementById('edit-mecanico').value;
  
  if (!elecValue && !mecValue) {
    if (manualOverrides[weekKey]) {
      delete manualOverrides[weekKey];
    }
  } else {
    if (!manualOverrides[weekKey]) {
      manualOverrides[weekKey] = {};
    }
    if (elecValue) manualOverrides[weekKey].electrico = elecValue;
    else delete manualOverrides[weekKey].electrico;
    
    if (mecValue) manualOverrides[weekKey].mecanico = mecValue;
    else delete manualOverrides[weekKey].mecanico;
  }
  
  localStorage.manualOverrides = JSON.stringify(manualOverrides);
  render();
  renderCalendar();
  renderAdminGuardias();
  closeModal();
  alert("✅ Cambios guardados");
}

// ========== REINICIAR ROTACIÓN ==========
function resetToDefault() {
  if (confirm("¿Estás seguro de que quieres eliminar todos los cambios manuales y volver a la rotación automática?")) {
    manualOverrides = {};
    localStorage.manualOverrides = JSON.stringify({});
    render();
    renderCalendar();
    renderAdminGuardias();
    alert("✅ Rotación restablecida a automática");
  }
}

// ========== HISTORIAL ==========
function logCompletedWeek(){
  const hoy=new Date();
  const viernes=obtenerLunes(hoy);
  viernes.setDate(viernes.getDate()+4);
  
  if(hoy<viernes)return;
  
  const numeroSemana=calcularNumeroSemana(hoy);
  const clave=fd(obtenerLunes(hoy));
  
  if(history.some(h=>h.startsWith(clave)))return;
  
  const elecGuardia=guardia(electricos,numeroSemana);
  const mecGuardia=guardia(mecanicos,numeroSemana);
  
  history.unshift(`${clave} ⚡ ${elecGuardia} · 🔧 ${mecGuardia}`);
  history=history.slice(0,30);
  localStorage.history=JSON.stringify(history);
}

function renderHistory(){
  historyList.innerHTML="";
  history.forEach(h=>historyList.innerHTML+=`<div class="history-item">${h}</div>`);
}

  renderAdmin();

};

document.getElementById('editModal').addEventListener('click', function(e) {

});

renderCalendar();

render();

renderAdmin();
renderAdminGuardias();
