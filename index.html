<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi</title>

<link rel="manifest" href="/Guardias/manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="/Guardias/icon-192.png">
<link rel="apple-touch-icon" href="/Guardias/icon-192.png">

<style>
:root{
  --primary:#1e88e5;
  --bg:#f4f6fa;
  --text:#222;
  --card:#fff;
  --shadow:0 8px 20px rgba(0,0,0,.15);
  --highlight:#ffe600;
}
body.dark{
  --bg:#121212;
  --text:#eee;
  --card:#1e1e1e;
}
body{
  margin:0;
  font-family:Segoe UI,system-ui;
  background:var(--bg);
  color:var(--text);
}
header{
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  color:#fff;
  padding:20px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}
#subtitle{opacity:.85;margin-top:5px}
.container{max-width:900px;margin:auto;overflow:hidden}
.carousel{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.card{
  min-width:300px;
  scroll-snap-align:center;
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:20px;
}
.card-header{font-weight:700;text-align:center;margin-bottom:10px}
.guardias{display:flex;gap:15px;flex-wrap:wrap}
.guardia{
  flex:1;
  background:var(--card);
  border-radius:15px;
  padding:15px;
  text-align:center;
}
.icono{font-size:2.5em}
.nombre{font-size:1.2em;font-weight:700;cursor:pointer}
.nombre.inactivo{opacity:.4;text-decoration:line-through}
.days{display:flex;justify-content:space-between;margin-top:8px}
.day{font-size:.75em}
.today{background:var(--highlight);padding:2px 6px;border-radius:6px}
.nav{display:flex;justify-content:space-between;padding:10px}
button{
  border:none;
  border-radius:12px;
  padding:10px 16px;
  background:var(--primary);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
#nextInfo{
  margin:20px;
  background:var(--card);
  padding:20px;
  border-radius:20px;
  box-shadow:var(--shadow);
  text-align:center;
}
details{
  margin:20px;
  background:var(--card);
  padding:15px;
  border-radius:15px;
}
textarea{width:100%;padding:8px;border-radius:10px}
.top-buttons{
  position:fixed;
  top:10px;
  right:10px;
  display:flex;
  gap:8px;
  z-index:200;
}
</style>
</head>

<body>

<div class="top-buttons">
  <button id="night">🌙</button>
  <button id="adminBtn">⚙️</button>
</div>

<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>

<div class="nav">
  <button id="prev">⬅ Semana anterior</button>
  <button id="next">Semana siguiente ➡</button>
</div>

<div class="container">
  <div class="carousel" id="carousel"></div>
</div>

<div id="nextInfo"></div>

<details id="adminPanel">
<summary>Panel Administrador</summary>
<p>Eléctricos</p>
<textarea id="elec">Abde,Fran,Dani,Jose,Fran Ruiz,Hicham</textarea>
<p>Mecánicos</p>
<textarea id="mec">Ramon,Santy,Traian,Manu,Fran Alba,Cele</textarea>
<button id="save">Guardar</button>
</details>

<script>
/* ===== CONFIG ===== */
const ADMIN_PASSWORD="alsi2026";

/* ===== MODO NOCHE ===== */
night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
}
if(localStorage.dark==="true")document.body.classList.add("dark");

/* ===== ADMIN ===== */
let isAdmin=localStorage.isAdmin==="true";
adminPanel.style.display=isAdmin?"block":"none";

adminBtn.onclick=()=>{
 if(isAdmin){
  isAdmin=false;
  localStorage.isAdmin="false";
  adminPanel.style.display="none";
 }else{
  const p=prompt("Contraseña admin");
  if(p===ADMIN_PASSWORD){
   isAdmin=true;
   localStorage.isAdmin="true";
   adminPanel.style.display="block";
  }
 }
}

/* ===== DATOS ===== */
function parse(txt){
 return txt.split(",").map(n=>({
  nombre:n.trim(),
  activo:true,
  estado:"ok"
 }));
}

let electricos=localStorage.e?JSON.parse(localStorage.e):parse(elec.value);
let mecanicos=localStorage.m?JSON.parse(localStorage.m):parse(mec.value);
let offset=0;

/* ===== FECHAS ===== */
const lunes=d=>{
 d=new Date(d);
 let n=d.getDay();
 d.setDate(d.getDate()-(n===0?6:n-1));
 return d;
}
const fd=d=>d.toLocaleDateString();

/* ===== GUARDIA ===== */
function guardia(lista,o){
 const disp=lista.filter(p=>p.activo&&p.estado==="ok");
 if(!disp.length)return "—";
 return disp[((o%disp.length)+disp.length)%disp.length].nombre;
}

/* ===== RENDER ===== */
function render(){
 const car=carousel;
 car.innerHTML="";
 const base=lunes(new Date());
 const ini=new Date(base);ini.setDate(ini.getDate()+offset*7);
 const fin=new Date(ini);fin.setDate(fin.getDate()+4);
 subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

 for(let i=-1;i<=1;i++){
  let l=new Date(ini);l.setDate(l.getDate()+i*7);
  let v=new Date(l);v.setDate(v.getDate()+4);
  const days=["Lun","Mar","Mié","Jue","Vie"].map((d,j)=>{
    const t=(new Date().getDay()===j+1 && i===0)?"today":"";
    return `<div class="day ${t}">${d}</div>`;
  }).join("");

  car.innerHTML+=`
  <div class="card">
   <div class="card-header">${fd(l)} - ${fd(v)}</div>
   <div class="guardias">
    <div class="guardia">
     <div class="icono">⚡</div>
     <div class="nombre persona" data-t="e">${guardia(electricos,offset+i)}</div>
     <div class="days">${days}</div>
    </div>
    <div class="guardia">
     <div class="icono">🔧</div>
     <div class="nombre persona" data-t="m">${guardia(mecanicos,offset+i)}</div>
     <div class="days">${days}</div>
    </div>
   </div>
  </div>`;
 }

 requestAnimationFrame(()=>{
  car.scrollLeft=car.children[0].offsetWidth+10;
 });

 let pl=new Date(ini);pl.setDate(pl.getDate()+7);
 let pv=new Date(pl);pv.setDate(pv.getDate()+4);
 nextInfo.innerHTML=`<h3>🔜 Próxima semana</h3>
 ⚡ ${guardia(electricos,offset+1)} · 🔧 ${guardia(mecanicos,offset+1)}<br>
 ${fd(pl)} - ${fd(pv)}`;
}

/* ===== TOCAR PERSONAS ===== */
document.addEventListener("click",e=>{
 if(!isAdmin||!e.target.classList.contains("persona"))return;
 let nombre=e.target.textContent;
 let lista=e.target.dataset.t==="e"?electricos:mecanicos;
 let p=lista.find(x=>x.nombre===nombre);
 if(!p)return;
 let op=prompt("1 Activo\n2 Vacaciones\n3 Fuera",p.estado==="ok"?"1":p.estado==="vacaciones"?"2":"3");
 if(op==="1"){p.activo=true;p.estado="ok";}
 if(op==="2"){p.activo=false;p.estado="vacaciones";}
 if(op==="3"){p.activo=false;p.estado="fuera";}
 guardar();
 render();
});

/* ===== GUARDAR ===== */
function guardar(){
 localStorage.e=JSON.stringify(electricos);
 localStorage.m=JSON.stringify(mecanicos);
}

/* ===== BOTONES ===== */
prev.onclick=()=>{offset--;render()}
next.onclick=()=>{offset++;render()}

/* ===== SWIPE ===== */
let sx=0;
carousel.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
carousel.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-sx;
 if(dx>60){offset--;render()}
 if(dx<-60){offset++;render()}
});

/* ===== NOTIFICACIONES ===== */
let miNombre=localStorage.miNombre||prompt("Tu nombre:");
if(miNombre)localStorage.miNombre=miNombre;
if("Notification"in window && Notification.permission!=="granted")
 Notification.requestPermission();

/* ===== INIT ===== */
render();

/* ===== SW ===== */
if("serviceWorker"in navigator)
 navigator.serviceWorker.register("/Guardias/service-worker.js");
</script>

</body>
</html>
