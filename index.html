<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi</title>

<link rel="manifest" href="/Guardias/manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="/Guardias/icon-192.png">
<link rel="apple-touch-icon" href="/Guardias/icon-192.png">

<style>
:root{
  --primary:#1e88e5;
  --bg:#f4f6fa;
  --text:#222;
  --card:#fff;
  --shadow:0 8px 20px rgba(0,0,0,.15);
}
body.dark{
  --bg:#121212;
  --text:#eee;
  --card:#1e1e1e;
}
body{margin:0;font-family:Segoe UI;background:var(--bg);color:var(--text);}
header{
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  color:#fff;
  padding:20px;
  text-align:center;
  position:sticky;
  top:0;
}
.container{max-width:900px;margin:auto;overflow:hidden;}
.carousel{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.card{
  min-width:300px;
  scroll-snap-align:center;
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:20px;
}
.guardias{display:flex;gap:15px;flex-wrap:wrap;}
.guardia{flex:1;background:var(--card);border-radius:15px;padding:15px;text-align:center;}
.icono{font-size:2.5em;}
.nombre{font-size:1.2em;font-weight:700;}
.nav{display:flex;justify-content:space-between;padding:10px;}
button{border:none;border-radius:12px;padding:10px 16px;background:var(--primary);color:#fff;font-weight:600;}
#nextInfo{margin:20px;background:var(--card);padding:20px;border-radius:20px;box-shadow:var(--shadow);text-align:center;}
details{margin:20px;background:var(--card);padding:15px;border-radius:15px;}
textarea{width:100%;padding:8px;border-radius:10px;}
.top{position:fixed;top:10px;right:10px;display:flex;gap:8px;}
</style>
</head>

<body>

<div class="top">
  <button id="night">🌙</button>
  <button id="adminBtn">⚙️</button>
</div>

<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>

<div class="nav">
  <button id="prev">⬅ Semana anterior</button>
  <button id="next">Semana siguiente ➡</button>
</div>

<div class="container">
  <div class="carousel" id="carousel"></div>
</div>

<div id="nextInfo"></div>

<details id="adminPanel">
<summary>Administrador</summary>
<p>Eléctricos</p>
<textarea id="elec">Abde,Fran,Dani,Jose,Fran Ruiz,Hicham</textarea>
<p>Mecánicos</p>
<textarea id="mec">Ramon,Santy,Traian,Manu,Fran Alba,Cele</textarea>
<button id="save">Guardar</button>
</details>

<script>
// 🌙 modo noche
night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
}
if(localStorage.dark==="true")document.body.classList.add("dark");

// 🔐 admin
const ADMIN_PASS="alsi2026";
let isAdmin=false;
adminPanel.style.display="none";

adminBtn.onclick=()=>{
 if(isAdmin){
  isAdmin=false;
  adminPanel.style.display="none";
 }else{
  if(prompt("Contraseña admin")==ADMIN_PASS){
    isAdmin=true;
    adminPanel.style.display="block";
  }
 }
}

// datos
let electricos=(localStorage.e||elec.value).split(",").map(e=>e.trim());
let mecanicos=(localStorage.m||mec.value).split(",").map(e=>e.trim());
let offset=0;

// fechas
const lunes=d=>{
 d=new Date(d);
 let n=d.getDay();
 d.setDate(d.getDate()-(n===0?6:n-1));
 return d;
}
const fd=d=>d.toLocaleDateString();

// rotación
const guardia=(l,o)=>l[((o%l.length)+l.length)%l.length];

// render
function render(){
 carousel.innerHTML="";
 const base=lunes(new Date());
 const ini=new Date(base);ini.setDate(ini.getDate()+offset*7);
 const fin=new Date(ini);fin.setDate(fin.getDate()+4);
 subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

 for(let i=-1;i<=1;i++){
  let l=new Date(ini);l.setDate(l.getDate()+i*7);
  let v=new Date(l);v.setDate(v.getDate()+4);
  carousel.innerHTML+=`
  <div class="card">
   <h3>${fd(l)} - ${fd(v)}</h3>
   <div class="guardias">
    <div class="guardia"><div class="icono">⚡</div><div class="nombre">${guardia(electricos,offset+i)}</div></div>
    <div class="guardia"><div class="icono">🔧</div><div class="nombre">${guardia(mecanicos,offset+i)}</div></div>
   </div>
  </div>`;
 }

 requestAnimationFrame(()=>{
  carousel.scrollLeft=carousel.children[0].offsetWidth+10;
 });

 let pl=new Date(ini);pl.setDate(pl.getDate()+7);
 let pv=new Date(pl);pv.setDate(pv.getDate()+4);
 nextInfo.innerHTML=`<h3>🔜 Próxima semana</h3>
 ⚡ ${guardia(electricos,offset+1)} · 🔧 ${guardia(mecanicos,offset+1)}<br>
 ${fd(pl)} - ${fd(pv)}`;
}

// botones
prev.onclick=()=>{offset--;render()}
next.onclick=()=>{offset++;render()}

// swipe
let sx=0;
carousel.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
carousel.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-sx;
 if(dx>60){offset--;render()}
 if(dx<-60){offset++;render()}
});

// guardar
save.onclick=()=>{
 electricos=elec.value.split(",").map(e=>e.trim());
 mecanicos=mec.value.split(",").map(e=>e.trim());
 localStorage.e=elec.value;
 localStorage.m=mec.value;
 render();
};

render();
</script>

</body>
</html>
