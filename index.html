<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi</title>

<link rel="manifest" href="/Guardias/manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="/Guardias/icon-192.png">

<style>
:root{
 --primary:#1e88e5;--bg:#f2f4f8;--card:#fff;
 --text:#1f2937;--muted:#6b7280;
 --shadow:0 10px 25px rgba(0,0,0,.12);
 --radius:18px;
}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}

header{
 background:linear-gradient(135deg,#1e88e5,#1565c0);
 color:#fff;padding:20px;text-align:center;
 position:sticky;top:0;z-index:100
}

button{
 background:var(--primary);color:#fff;border:none;
 padding:10px 16px;border-radius:14px;font-weight:700
}

#night{position:fixed;top:12px;right:12px;z-index:200}

.nav{display:flex;justify-content:space-between;padding:10px}

.container{max-width:960px;margin:auto;padding:10px}

.carousel{
 display:flex;gap:14px;overflow-x:auto;
 scroll-snap-type:x mandatory
}

.card{
 min-width:320px;background:var(--card);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 padding:20px;scroll-snap-align:center
}

.guardias{display:flex;gap:14px;margin-top:14px}
.guardia{
 flex:1;text-align:center;
 background:rgba(0,0,0,.05);
 border-radius:14px;padding:14px
}
body.dark .guardia{background:rgba(255,255,255,.06)}

.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted)}
.time{font-weight:700;font-size:.9em}

/* ===== CALENDARIO ===== */
#calendar{
 margin:20px;background:var(--card);
 border-radius:var(--radius);padding:16px
}
.calendar-grid{
 display:grid;grid-template-columns:repeat(7,1fr);
 gap:4px;margin-top:10px
}
.calendar-day{
 font-size:.7rem;text-align:center;
 padding:6px;border-radius:8px;
 background:rgba(0,0,0,.05);cursor:pointer
}
body.dark .calendar-day{background:rgba(255,255,255,.08)}
.calendar-day.outside{
 background:rgba(0,0,0,.02);color:var(--muted);cursor:default
}

/* ===== ADMIN ===== */
details{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.admin-person{
 display:flex;justify-content:space-between;
 border-bottom:1px solid rgba(0,0,0,.1);padding:6px 0
}
select{border-radius:10px;padding:5px}

/* ===== HISTORIAL ===== */
#history{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.history-item{
 font-size:.9em;border-bottom:1px dashed rgba(0,0,0,.2);
 padding:6px 0
}
</style>
</head>

<body>

<button id="night">🌙</button>

<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>

<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>

<div class="container">
<div class="carousel" id="carousel"></div>
</div>

<!-- CALENDARIO -->
<div id="calendar">
<div style="display:flex;justify-content:space-between;align-items:center">
<button onclick="changeMonth(-1)">◀</button>
<h3 id="calendarTitle"></h3>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- ADMIN -->
<details id="admin">
<summary>⚙️ Administrador</summary>

<h3>⚡ Eléctricos</h3>
<div id="admin-elec"></div>

<h3>🔧 Mecánicos</h3>
<div id="admin-mec"></div>

<br><button id="save">💾 Guardar</button>
</details>

<div id="history">
<h3>📜 Historial real</h3>
<div id="historyList"></div>
</div>

<script>
/* ===== MODO NOCHE ===== */
night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
};
if(localStorage.dark==="true")document.body.classList.add("dark");

/* ===== ADMIN ===== */
const ADMIN_PASS="alsi2026";
setTimeout(()=>{
 if(prompt("Contraseña admin")!==ADMIN_PASS)admin.style.display="none";
},300);

/* ===== DATOS ===== */
let electricos=["Fran Ruiz","Hicham","Jose","Abde","Dani","Fran"];
let mecanicos=["Ramon","Traian","Manu","Fran Alba","Cele","Santy"];
let estados=JSON.parse(localStorage.estados||"{}");
let history=JSON.parse(localStorage.history||"[]");
let offset=0;
let calendarMonth=new Date();

try{electricos=JSON.parse(localStorage.electricos)||electricos}catch{}
try{mecanicos=JSON.parse(localStorage.mecanicos)||mecanicos}catch{}

/* ===== FECHAS ===== */
const lunes=d=>{
 d=new Date(d);let n=d.getDay();
 d.setDate(d.getDate()-(n===0?6:n-1));return d;
};
const fd=d=>d.toLocaleDateString();
const weekDiff=(a,b)=>Math.floor((lunes(a)-lunes(b))/604800000);

/* ===== GUARDIAS ===== */
const activos=l=>l.filter(p=>!estados[p]||estados[p]==="activo");
const guardia=(l,o)=>{
 const a=activos(l);
 return a.length?a[((o%a.length)+a.length)%a.length]:"Nadie";
};

/* ===== CALENDARIO ===== */
function renderCalendar(){
 calendarGrid.innerHTML="";
 const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();
 calendarTitle.textContent=`📆 ${calendarMonth.toLocaleString("es",{month:"long"})} ${y}`;
 const first=new Date(y,m,1),last=new Date(y,m+1,0);
 let start=first.getDay()||7,day=1;
 for(let i=1;i<=42;i++){
  if(i<start||day>last.getDate()){
   calendarGrid.innerHTML+=`<div class="calendar-day outside"></div>`;
  }else{
   const d=new Date(y,m,day);
   const w=weekDiff(d,new Date());
   calendarGrid.innerHTML+=`
    <div class="calendar-day" onclick="offset=${w};render()">
     <div>${day}</div>
     <small>⚡ ${guardia(electricos,w)}</small><br>
     <small>🔧 ${guardia(mecanicos,w)}</small>
    </div>`;
   day++;
  }
 }
}
function changeMonth(d){calendarMonth.setMonth(calendarMonth.getMonth()+d);renderCalendar();}

/* ===== RENDER ===== */
function render(){
 carousel.innerHTML="";
 const base=lunes(new Date());
 const ini=new Date(base);ini.setDate(ini.getDate()+offset*7);
 const fin=new Date(ini);fin.setDate(fin.getDate()+4);
 subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

 for(let i=-1;i<=1;i++){
  const l=new Date(ini);l.setDate(l.getDate()+i*7);
  const v=new Date(l);v.setDate(v.getDate()+4);
  carousel.innerHTML+=`
  <div class="card">
   <h3>${fd(l)} - ${fd(v)}</h3>
   <div class="guardias">
    <div class="guardia">
     <div class="icono">⚡</div>
     <div class="nombre">${guardia(electricos,offset+i)}</div>
     <div class="days">L–V</div>
     <div class="time">15:30 – 19:00</div>
    </div>
    <div class="guardia">
     <div class="icono">🔧</div>
     <div class="nombre">${guardia(mecanicos,offset+i)}</div>
     <div class="days">L–V</div>
     <div class="time">15:30 – 19:00</div>
    </div>
   </div>
  </div>`;
 }
 renderHistory();
 requestAnimationFrame(()=>carousel.scrollLeft=carousel.children[0].offsetWidth+14);
}

/* ===== HISTORIAL REAL ===== */
function logCompletedWeek(){
 const now=new Date();
 const friday=lunes(now);friday.setDate(friday.getDate()+4);
 if(now<friday)return;
 const key=fd(lunes(now));
 if(history.some(h=>h.startsWith(key)))return;
 history.unshift(`${key} ⚡ ${guardia(electricos,0)} · 🔧 ${guardia(mecanicos,0)}`);
 history=history.slice(0,30);
 localStorage.history=JSON.stringify(history);
}
function renderHistory(){
 historyList.innerHTML="";
 history.forEach(h=>historyList.innerHTML+=`<div class="history-item">${h}</div>`);
}

/* ===== ADMIN ===== */
function renderAdmin(){
 [["elec",electricos],["mec",mecanicos]].forEach(([id,list])=>{
  const c=document.getElementById("admin-"+id);c.innerHTML="";
  list.forEach((p,i)=>{
   c.innerHTML+=`
   <div class="admin-person">${p}
    <div>
     <button onclick="move('${id}',${i},-1)">▲</button>
     <button onclick="move('${id}',${i},1)">▼</button>
     <select onchange="estados['${p}']=this.value">
      <option value="activo">Activo</option>
      <option value="vacaciones">Vacaciones</option>
      <option value="baja">Baja</option>
      <option value="viaje">Viaje</option>
     </select>
    </div>
   </div>`;
  });
 });
}
function move(t,i,d){
 const l=t==="elec"?electricos:mecanicos;
 const n=i+d;if(n<0||n>=l.length)return;
 [l[i],l[n]]=[l[n],l[i]];
 renderAdmin();render();renderCalendar();
}

prev.onclick=()=>{offset--;render()};
next.onclick=()=>{offset++;render()};
save.onclick=()=>{
 localStorage.electricos=JSON.stringify(electricos);
 localStorage.mecanicos=JSON.stringify(mecanicos);
 localStorage.estados=JSON.stringify(estados);
 renderCalendar();alert("Guardado");
};

/* ===== INIT ===== */
renderAdmin();
renderCalendar();
logCompletedWeek();
render();
</script>

</body>
</html>
