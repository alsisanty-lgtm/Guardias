<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi</title>

<style>
:root{
  --primary:#1e88e5;
  --bg:#f2f4f8;
  --card:#fff;
  --text:#1f2937;
  --muted:#6b7280;
  --shadow:0 10px 25px rgba(0,0,0,.12);
  --radius:18px;
}
body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}
header{
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  color:#fff;
  padding:20px;
  text-align:center;
  position:sticky;
  top:0;
}
button{
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:10px 18px;
  font-weight:700;
}
#night,#adminBtn{
  position:fixed;
  top:12px;
}
#night{right:12px}
#adminBtn{right:60px}

.nav{
  display:flex;
  justify-content:space-between;
  padding:10px;
}

.container{
  max-width:900px;
  margin:auto;
  overflow:hidden;
}

.carousel{
  display:flex;
  transition:transform .3s ease;
}

.card{
  min-width:100%;
  box-sizing:border-box;
  padding:20px;
}

.card-inner{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.guardias{
  display:flex;
  gap:14px;
  margin-top:14px;
}

.guardia{
  flex:1;
  background:rgba(0,0,0,.05);
  border-radius:14px;
  padding:14px;
  text-align:center;
}
body.dark .guardia{background:rgba(255,255,255,.06)}

.icono{font-size:2.2em}
.nombre{font-weight:800;font-size:1.1em}
.days{font-size:.85em;color:var(--muted);margin-top:6px}
.time{font-weight:700;margin-top:4px}

#adminPanel{
  display:none;
  margin:20px;
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
}

.admin-person{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
}
select{border-radius:10px;padding:5px}

#history{
  margin:20px;
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
}
</style>
</head>

<body>

<button id="night">🌙</button>
<button id="adminBtn">⚙️</button>

<header>
  <h1>Guardias Alsi</h1>
  <div id="subtitle"></div>
</header>

<div class="nav">
  <button id="prev">⬅</button>
  <button id="next">➡</button>
</div>

<div class="container">
  <div class="carousel" id="carousel"></div>
</div>

<div id="adminPanel">
  <h3>Administrador</h3>
  <strong>Eléctricos</strong>
  <div id="admin-elec"></div>
  <strong>Mecánicos</strong>
  <div id="admin-mec"></div>
</div>

<div id="history">
  <h3>Historial</h3>
  <div id="historyList"></div>
</div>

<script>
/* ===== CONFIG ===== */
const ADMIN_PASS="alsi2026";
let offset=0;

/* ===== DATOS ===== */
const electricos=["Abde","Fran","Dani","Jose","Fran Ruiz","Hicham"];
const mecanicos=["Ramon","Santy","Traian","Manu","Fran Alba","Cele"];
let estados=JSON.parse(localStorage.estados||"{}");
let history=JSON.parse(localStorage.history||"[]");

/* ===== FECHAS ===== */
const lunes=d=>{
  d=new Date(d);
  let n=d.getDay();
  d.setDate(d.getDate()-(n===0?6:n-1));
  return d;
}
const fd=d=>d.toLocaleDateString();

/* ===== GUARDIA ===== */
const activos=l=>l.filter(p=>!estados[p]||estados[p]==="activo");
const guardia=(l,o)=>{
  let a=activos(l);
  return a.length?a[((o%a.length)+a.length)%a.length]:"—";
}

/* ===== RENDER ===== */
function render(){
  const car=document.getElementById("carousel");
  car.innerHTML="";
  const base=lunes(new Date());
  const ini=new Date(base);
  ini.setDate(ini.getDate()+offset*7);
  const fin=new Date(ini);
  fin.setDate(fin.getDate()+4);
  subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

  const e=guardia(electricos,offset);
  const m=guardia(mecanicos,offset);

  car.innerHTML=`
  <div class="card">
    <div class="card-inner">
      <h3>${fd(ini)} - ${fd(fin)}</h3>
      <div class="guardias">
        <div class="guardia">
          <div class="icono">⚡</div>
          <div class="nombre">${e}</div>
          <div class="days">Lun · Mar · Mié · Jue · Vie</div>
          <div class="time">15:30 – 19:00</div>
        </div>
        <div class="guardia">
          <div class="icono">🔧</div>
          <div class="nombre">${m}</div>
          <div class="days">Lun · Mar · Mié · Jue · Vie</div>
          <div class="time">15:30 – 19:00</div>
        </div>
      </div>
    </div>
  </div>`;

  history.unshift(`${fd(ini)} ⚡ ${e} | 🔧 ${m}`);
  history=history.slice(0,15);
  localStorage.history=JSON.stringify(history);
  renderHistory();
}

/* ===== HISTORIAL ===== */
function renderHistory(){
  historyList.innerHTML="";
  history.forEach(h=>{
    historyList.innerHTML+=`<div>${h}</div>`;
  });
}

/* ===== ADMIN ===== */
function renderAdmin(){
 ["elec","mec"].forEach(t=>{
  const c=document.getElementById("admin-"+t);
  c.innerHTML="";
  (t==="elec"?electricos:mecanicos).forEach(p=>{
    c.innerHTML+=`
    <div class="admin-person">
      ${p}
      <select data-p="${p}">
        <option value="activo">Activo</option>
        <option value="vacaciones">Vacaciones</option>
        <option value="baja">Baja</option>
        <option value="viaje">Viaje</option>
      </select>
    </div>`;
  });
 });
 document.querySelectorAll("select[data-p]").forEach(s=>{
   s.value=estados[s.dataset.p]||"activo";
   s.onchange=()=>{
     estados[s.dataset.p]=s.value;
     localStorage.estados=JSON.stringify(estados);
     render();
   }
 });
}

/* ===== EVENTOS ===== */
prev.onclick=()=>{offset--;render()}
next.onclick=()=>{offset++;render()}

night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
}
if(localStorage.dark==="true")document.body.classList.add("dark");

adminBtn.onclick=()=>{
 if(localStorage.isAdmin==="true"){
   adminPanel.style.display=
    adminPanel.style.display==="none"?"block":"none";
 }else{
   const p=prompt("Contraseña admin");
   if(p===ADMIN_PASS){
     localStorage.isAdmin="true";
     adminPanel.style.display="block";
   }
 }
}

/* ===== SWIPE ===== */
let startX=0;
carousel.addEventListener("touchstart",e=>{
 startX=e.touches[0].clientX;
},{passive:true});
carousel.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-startX;
 if(dx>60){offset--;render()}
 if(dx<-60){offset++;render()}
},{passive:true});

/* INIT */
renderAdmin();
render();
</script>

</body>
</html>
