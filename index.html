<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi PRO</title>

<style>
:root{
  --primary:#1e88e5;
  --bg:#f2f4f8;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --shadow:0 8px 22px rgba(0,0,0,.15);
  --radius:18px;
}
body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
body{
  margin:0;
  font-family:system-ui,Segoe UI;
  background:var(--bg);
  color:var(--text);
}
header{
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  color:#fff;
  padding:18px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}
#subtitle{opacity:.9;font-size:.9em;margin-top:6px}

.topbar{
  position:fixed;
  top:10px;
  right:10px;
  display:flex;
  gap:8px;
  z-index:20;
}
button{
  border:none;
  border-radius:12px;
  padding:8px 14px;
  font-weight:700;
  background:var(--primary);
  color:#fff;
}

.container{max-width:950px;margin:auto;padding:10px}

.carousel{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling: touch;
}
.carousel::-webkit-scrollbar{display:none}

.card{
  min-width:320px;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  scroll-snap-align:center;
}

.guardias{
  display:flex;
  gap:14px;
  margin-top:14px;
}
.guardia{
  flex:1;
  background:rgba(0,0,0,.05);
  border-radius:14px;
  padding:12px;
  text-align:center;
}
body.dark .guardia{background:rgba(255,255,255,.06)}

.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted);margin-top:4px}
.time{font-size:.9em;font-weight:700;margin-top:4px}

details{
  margin:20px;
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.admin-person{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid rgba(0,0,0,.1);
}
select{border-radius:8px;padding:4px}

#history{
  margin:20px;
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.history-item{
  font-size:.9em;
  padding:6px 0;
  border-bottom:1px dashed rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="topbar">
  <button id="night">🌙</button>
  <button id="adminBtn">Admin</button>
</div>

<header>
<h1>Guardias Alsi PRO</h1>
<div id="subtitle"></div>
</header>

<div class="container">
  <div class="carousel" id="carousel"></div>
</div>

<details id="admin" style="display:none">
<summary>⚙️ Administrador</summary>

<h3>⚡ Eléctricos</h3>
<div id="admin-elec"></div>

<h3>🔧 Mecánicos</h3>
<div id="admin-mec"></div>

<br>
<button id="save">💾 Guardar</button>
</details>

<div id="history">
<h3>📜 Historial de guardias</h3>
<div id="historyList"></div>
</div>

<script>
// 🌙 MODO OSCURO
night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
}
if(localStorage.dark==="true")document.body.classList.add("dark");

// 🔐 ADMIN CON CONTRASEÑA REAL
adminBtn.onclick=()=>{
 const pass=prompt("Contraseña administrador");
 if(pass==="alsi2026"){
   admin.style.display="block";
 }else{
   alert("Contraseña incorrecta");
 }
};

// DATOS
let electricos=["Abde","Fran","Dani","Jose","Fran Ruiz","Hicham"];
let mecanicos=["Ramon","Santy","Traian","Manu","Fran Alba","Cele"];
let estados=JSON.parse(localStorage.estados||"{}");
let history=JSON.parse(localStorage.history||"[]");
let lastLoggedWeek=localStorage.lastLoggedWeek||"";
let offset=0;

// FECHAS
const lunes=d=>{
 d=new Date(d);
 let n=d.getDay();
 d.setDate(d.getDate()-(n===0?6:n-1));
 return d;
}
const fd=d=>d.toLocaleDateString();

// ROTACIÓN
const activos=l=>l.filter(p=>!estados[p]||estados[p]==="activo");
const guardia=(l,o)=>{
 let a=activos(l);
 return a.length?a[((o%a.length)+a.length)%a.length]:"Nadie";
};

// ADMIN
function renderAdmin(){
 ["elec","mec"].forEach(t=>{
  let c=document.getElementById("admin-"+t);
  c.innerHTML="";
  (t==="elec"?electricos:mecanicos).forEach(p=>{
   let s=estados[p]||"activo";
   c.innerHTML+=`
   <div class="admin-person">
    ${p}
    <select data-p="${p}">
     <option value="activo" ${s==="activo"?"selected":""}>Activo</option>
     <option value="vacaciones" ${s==="vacaciones"?"selected":""}>Vacaciones</option>
     <option value="baja" ${s==="baja"?"selected":""}>Baja</option>
     <option value="viaje" ${s==="viaje"?"selected":""}>Viaje</option>
    </select>
   </div>`;
  });
 });
 document.querySelectorAll("select").forEach(s=>{
  s.onchange=()=>{estados[s.dataset.p]=s.value;}
 });
}

// RENDER PRINCIPAL
function render(){
 carousel.innerHTML="";
 let base=lunes(new Date());
 let ini=new Date(base);ini.setDate(ini.getDate()+offset*7);
 let fin=new Date(ini);fin.setDate(fin.getDate()+4);
 subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

 let weekKey=ini.toISOString().slice(0,10);

 if(offset===0 && lastLoggedWeek!==weekKey){
  let e=guardia(electricos,0);
  let m=guardia(mecanicos,0);
  history.unshift(`${fd(ini)} → ⚡ ${e} | 🔧 ${m}`);
  history=history.slice(0,20);
  localStorage.history=JSON.stringify(history);
  localStorage.lastLoggedWeek=weekKey;
  lastLoggedWeek=weekKey;
 }

 for(let i=-1;i<=1;i++){
  let l=new Date(ini);l.setDate(l.getDate()+i*7);
  let v=new Date(l);v.setDate(v.getDate()+4);
  carousel.innerHTML+=`
  <div class="card">
   <h3>${fd(l)} - ${fd(v)}</h3>
   <div class="guardias">
    <div class="guardia">
     <div class="icono">⚡</div>
     <div class="nombre">${guardia(electricos,offset+i)}</div>
     <div class="days">Lun · Mar · Mié · Jue · Vie</div>
     <div class="time">15:30 – 19:00</div>
    </div>
    <div class="guardia">
     <div class="icono">🔧</div>
     <div class="nombre">${guardia(mecanicos,offset+i)}</div>
     <div class="days">Lun · Mar · Mié · Jue · Vie</div>
     <div class="time">15:30 – 19:00</div>
    </div>
   </div>
  </div>`;
 }
 renderHistory();
}

// HISTORIAL
function renderHistory(){
 historyList.innerHTML="";
 history.forEach(h=>historyList.innerHTML+=`<div class="history-item">${h}</div>`);
}

// GUARDAR
save.onclick=()=>{
 localStorage.estados=JSON.stringify(estados);
 alert("Guardado correctamente");
 render();
};

renderAdmin();
render();
</script>

</body>
</html>
