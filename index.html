<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi</title>

<link rel="manifest" href="/Guardias/manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="/Guardias/icon-192.png">
<link rel="apple-touch-icon" href="/Guardias/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --primary:#1e88e5;
  --bg:#f4f6fa;
  --text:#222;
  --card:#fff;
  --shadow:0 8px 20px rgba(0,0,0,.15);
  --today:#ffd600;
}
body.dark{
  --bg:#121212;
  --text:#eee;
  --card:#1e1e1e;
}
body{margin:0;font-family:Segoe UI,sans-serif;background:var(--bg);color:var(--text);}
header{background:linear-gradient(135deg,var(--primary),#1565c0);color:#fff;padding:20px;text-align:center;position:sticky;top:0;z-index:100;}
.container{max-width:900px;margin:auto;overflow:hidden;position:relative;}
.carousel{display:flex;transition:.35s ease;touch-action:pan-y;}
.card{min-width:320px;margin:10px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px;flex-shrink:0;}
.guardias{display:flex;gap:15px;flex-wrap:wrap;}
.guardia{flex:1;background:var(--card);border-radius:15px;padding:15px;text-align:center;}
.icono{font-size:2.5em}
.nombre{font-size:1.2em;font-weight:700}
.nav{display:flex;justify-content:space-between;padding:10px}
button{border:none;border-radius:12px;padding:10px 16px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;}
#nextInfo{margin:20px;background:var(--card);padding:20px;border-radius:20px;box-shadow:var(--shadow);text-align:center}

/* Modal admin */
#modalAdmin{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999;
}
#modalContent{
  background:var(--card);padding:20px;border-radius:20px;width:90%;max-width:400px;box-shadow:var(--shadow);
}
#modalContent h3{text-align:center;margin-top:0;}
ul{list-style:none;padding:0;margin:0;}
li{margin-bottom:5px;}
</style>
</head>

<body>

<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>

<button id="night">🌙</button>
<button id="adminBtn">⚙️ Administrador</button>

<div class="container">
  <div class="nav">
    <button id="prev">⬅</button>
    <button id="next">➡</button>
  </div>
  <div class="carousel" id="carousel"></div>
</div>

<div id="nextInfo"></div>

<!-- Modal admin -->
<div id="modalAdmin">
  <div id="modalContent">
    <h3>Panel Administrador</h3>
    <p>Eléctricos:</p>
    <ul id="listElec"></ul>
    <p>Mecánicos:</p>
    <ul id="listMec"></ul>
    <button id="saveAdmin">💾 Guardar cambios</button>
    <button id="closeAdmin">❌ Cerrar</button>
  </div>
</div>

<script>
// 🌙 Modo nocturno
night.onclick=()=>{
  document.body.classList.toggle("dark");
  localStorage.dark=document.body.classList.contains("dark");
}
if(localStorage.dark==="true")document.body.classList.add("dark");

// 🔐 Admin con contraseña
const ADMIN_PASSWORD="guardias2026";
const adminBtn=document.getElementById("adminBtn");
const modal=document.getElementById("modalAdmin");
let isAdmin=false;

adminBtn.onclick=()=>{
  if(isAdmin){
    modal.style.display="flex";
    renderAdminLists();
    return;
  }
  const pass=prompt("Introduce contraseña de administrador:");
  if(pass===ADMIN_PASSWORD){
    isAdmin=true;
    modal.style.display="flex";
    renderAdminLists();
    alert("✅ Acceso concedido");
  }else{
    alert("❌ Contraseña incorrecta");
  }
}

document.getElementById("closeAdmin").onclick=()=>{modal.style.display="none";}

// Datos
let electricos=[], mecanicos=[], ausentes=[], offset=0;

// Funciones fecha
const lunes=d=>{
  d=new Date(d); let n=d.getDay(); d.setDate(d.getDate()-(n===0?6:n-1)); return d;
}
const fd=d=>d.toLocaleDateString();

// Guardias rotativas excluyendo ausentes
const guardia=(lista, offset)=>{
  let disp=lista.filter(x=>!ausentes.includes(x));
  if(disp.length===0) return "Nadie disponible";
  return disp[((offset%disp.length)+disp.length)%disp.length];
}

// Render carousel y próxima semana
function render(){
  const car=document.getElementById("carousel");
  car.innerHTML="";
  let base=lunes(new Date());
  let ini=new Date(base); ini.setDate(ini.getDate()+offset*7);
  let fin=new Date(ini); fin.setDate(fin.getDate()+4);
  subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

  for(let i=-1;i<=1;i++){
    let l=new Date(ini); l.setDate(l.getDate()+i*7);
    let v=new Date(l); v.setDate(v.getDate()+4);
    car.innerHTML+=`
    <div class="card">
      <h3>${fd(l)} - ${fd(v)}</h3>
      <div class="guardias">
        <div class="guardia"><div class="icono">⚡</div><div class="nombre">${guardia(electricos,offset+i)}</div></div>
        <div class="guardia"><div class="icono">🔧</div><div class="nombre">${guardia(mecanicos,offset+i)}</div></div>
      </div>
    </div>`;
  }

  // Próxima semana
  let pl=new Date(ini); pl.setDate(pl.getDate()+7);
  let pv=new Date(pl); pv.setDate(pv.getDate()+4);
  nextInfo.innerHTML=`<h3>🔜 Próxima semana</h3>
  ⚡ ${guardia(electricos,offset+1)} · 🔧 ${guardia(mecanicos,offset+1)}<br>${fd(pl)} - ${fd(pv)}`;

  // Centrar carrusel
  const cardWidth = car.children[0].offsetWidth + 20;
  car.style.transform = `translateX(-${cardWidth}px)`;
}

// Render listas admin con checkboxes
function renderAdminLists(){
  const listE=document.getElementById("listElec");
  const listM=document.getElementById("listMec");
  listE.innerHTML=""; listM.innerHTML="";
  electricos.forEach(name=>{
    const li=document.createElement("li");
    li.innerHTML=`<label><input type="checkbox" value="${name}" ${ausentes.includes(name)?"checked":""}> ${name}</label>`;
    listE.appendChild(li);
  });
  mecanicos.forEach(name=>{
    const li=document.createElement("li");
    li.innerHTML=`<label><input type="checkbox" value="${name}" ${ausentes.includes(name)?"checked":""}> ${name}</label>`;
    listM.appendChild(li);
  });
}

// Guardar cambios desde admin
document.getElementById("saveAdmin").onclick=()=>{
  const checked = Array.from(document.querySelectorAll("#modalContent input[type=checkbox]:checked")).map(x=>x.value);
  ausentes = checked;
  localStorage.a=ausentes.join(",");
  render();
  alert("✅ Guardias actualizadas");
}

// Navegación
document.getElementById("prev").onclick=()=>{offset--;render();}
document.getElementById("next").onclick=()=>{offset++;render();}

// Swipe táctil
let xStart=0;
const carousel=document.getElementById("carousel");
carousel.addEventListener("touchstart",e=>xStart=e.touches[0].clientX);
carousel.addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-xStart;
  if(dx>60){offset--;render();}
  if(dx<-60){offset++;render();}
});

// Cargar datos de localStorage
electricos=(localStorage.e||"Abde,Fran,Dani,Jose,Fran Ruiz,Hicham").split(",").map(x=>x.trim());
mecanicos=(localStorage.m||"Ramon,Santy,Traian,Manu,Fran Alba,Cele").split(",").map(x=>x.trim());
ausentes=(localStorage.a||"").split(",").map(x=>x.trim());

render();

// Service Worker
if("serviceWorker"in navigator)
 navigator.serviceWorker.register("/Guardias/service-worker.js");
</script>

</body>
</html>
