<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi PRO</title>

<style>
:root{
 --primary:#1e88e5;
 --bg:#f4f6fa;
 --text:#222;
 --card:#fff;
 --shadow:0 8px 20px rgba(0,0,0,.15);
}
body.dark{
 --bg:#121212;
 --text:#eee;
 --card:#1e1e1e;
}
body{margin:0;font-family:Segoe UI;background:var(--bg);color:var(--text);}
header{background:#1e88e5;color:#fff;padding:20px;text-align:center;}
.carousel{
 display:flex;
 gap:12px;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
 -webkit-overflow-scrolling:touch;
 padding:20px;
}
.card{
 min-width:280px;
 background:var(--card);
 border-radius:16px;
 box-shadow:var(--shadow);
 padding:15px;
 scroll-snap-align:center;
}
.guardias{display:flex;justify-content:space-around;margin-top:10px;}
.nombre{font-weight:bold;font-size:1.2em;}
button{
 border:none;
 border-radius:10px;
 padding:10px 14px;
 background:var(--primary);
 color:#fff;
 font-weight:600;
}
.nav{display:flex;justify-content:space-between;padding:10px;}
#admin{margin:20px;background:var(--card);padding:15px;border-radius:15px;}
</style>
</head>

<body>

<button id="night" style="position:fixed;top:10px;right:10px">🌙</button>
<button id="adminBtn" style="position:fixed;top:10px;right:60px">🔒</button>

<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>

<div class="nav">
<button onclick="offset--;render()">⬅</button>
<button onclick="offset++;render()">➡</button>
</div>

<div class="carousel" id="carousel"></div>

<details id="admin" style="display:none">
<summary>⚙️ Administrador</summary>
<div id="adminPanel"></div>
<button onclick="saveAdmin()">Guardar</button>
</details>

<script>
// 🌙 modo noche
night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
};
if(localStorage.dark==="true") document.body.classList.add("dark");

// 🔐 admin
adminBtn.onclick=()=>{
 const p=prompt("Contraseña admin");
 if(p==="admin2026"){
  admin.style.display="block";
  admin.open=true;
  renderAdmin();
 }
};

// datos
let offset=0;

let electricos=JSON.parse(localStorage.electricos||"null")||[
 {nombre:"Abde",activo:true},
 {nombre:"Fran",activo:true},
 {nombre:"Dani",activo:true},
 {nombre:"Jose",activo:true}
];

let mecanicos=JSON.parse(localStorage.mecanicos||"null")||[
 {nombre:"Ramon",activo:true},
 {nombre:"Santy",activo:true},
 {nombre:"Manu",activo:true}
];

// fechas
const lunes=d=>{
 d=new Date(d);
 const n=d.getDay();
 d.setDate(d.getDate()-(n===0?6:n-1));
 return d;
};
const fd=d=>d.toLocaleDateString();

// rotación segura
function guardia(lista,o){
 const a=lista.filter(p=>p.activo);
 if(a.length===0) return "Sin guardia";
 return a[((o%a.length)+a.length)%a.length].nombre;
}

// render
function render(){
 const car=document.getElementById("carousel");
 car.innerHTML="";
 const base=lunes(new Date());
 const ini=new Date(base); ini.setDate(ini.getDate()+offset*7);
 const fin=new Date(ini); fin.setDate(fin.getDate()+4);
 subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

 for(let i=-1;i<=1;i++){
  const l=new Date(ini); l.setDate(l.getDate()+i*7);
  const v=new Date(l); v.setDate(v.getDate()+4);
  car.innerHTML+=`
  <div class="card">
   <b>${fd(l)} - ${fd(v)}</b>
   <div class="guardias">
    <div>⚡<div class="nombre">${guardia(electricos,offset+i)}</div></div>
    <div>🔧<div class="nombre">${guardia(mecanicos,offset+i)}</div></div>
   </div>
  </div>`;
 }
}

// admin panel
function renderAdmin(){
 adminPanel.innerHTML="<h3>⚡ Eléctricos</h3>";
 electricos.forEach((e,i)=>{
  adminPanel.innerHTML+=`
  <label>
   <input type="checkbox" ${e.activo?"checked":""}
   onchange="electricos[${i}].activo=this.checked">
   ${e.nombre}
  </label><br>`;
 });
 adminPanel.innerHTML+="<h3>🔧 Mecánicos</h3>";
 mecanicos.forEach((m,i)=>{
  adminPanel.innerHTML+=`
  <label>
   <input type="checkbox" ${m.activo?"checked":""}
   onchange="mecanicos[${i}].activo=this.checked">
   ${m.nombre}
  </label><br>`;
 });
}

function saveAdmin(){
 localStorage.electricos=JSON.stringify(electricos);
 localStorage.mecanicos=JSON.stringify(mecanicos);
 render();
 alert("Guardado");
}

render();
 .days{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.day{
  font-size:0.8em;
  padding:4px 6px;
  border-radius:6px;
  background:rgba(0,0,0,0.05);
}

body.dark .day{
  background:rgba(255,255,255,0.12);
}

.day.today{
  background:var(--highlight);
  color:#000;
  font-weight:700;
}

</script>

</body>
</html>
