<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi</title>
<style>
:root{
 --primary:#1e88e5;--bg:#f2f4f8;--card:#fff;
 --text:#1f2937;--muted:#6b7280;
 --shadow:0 10px 25px rgba(0,0,0,.12);
 --radius:18px;
}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;}
header{
 background:linear-gradient(135deg,#1e88e5,#1565c0);
 color:#fff;padding:20px;text-align:center;
 position:sticky;top:0;z-index:100
}
button{
 background:var(--primary);color:#fff;border:none;
 padding:12px 18px;border-radius:14px;font-weight:700;
 cursor:pointer;font-size:16px;
}
#night{position:fixed;top:12px;right:12px;z-index:200;padding:10px;min-height:44px;}
.nav{display:flex;justify-content:space-between;padding:10px;gap:10px;}
.container{max-width:960px;margin:auto;padding:10px;}

/* ===== CARRUSEL SIMPLE QUE FUNCIONA ===== */
.carousel-container {
    width: 100%;
    overflow: hidden;
    position: relative;
}

.carousel-track {
    display: flex;
    transition: transform 0.4s ease;
    width: 300%; /* 3 slides */
}

.carousel-slide {
    flex: 0 0 33.333%;
    width: 33.333%;
    padding: 10px;
    box-sizing: border-box;
}

.card{
 background:var(--card);border-radius:var(--radius);
 box-shadow:var(--shadow);padding:20px;
 min-width:320px;margin:0;
}
.guardias{display:flex;gap:14px;margin-top:14px}
.guardia{
 flex:1;text-align:center;
 background:rgba(0,0,0,.05);
 border-radius:14px;padding:14px;
}
body.dark .guardia{background:rgba(255,255,255,.06)}
.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted)}
.time{font-weight:700;font-size:.9em}
.status-active{color:#10b981}
.status-vacaciones{color:#f59e0b}
.status-viaje{color:#8b5cf6}
.status-baja{color:#ef4444}
.status-inactivo{color:#6b7280}

/* Indicadores */
.carousel-indicators {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 20px 0 10px;
}

.carousel-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.5;
    transition: all 0.3s;
}

.carousel-indicator.active {
    opacity: 1;
    background: var(--primary);
    transform: scale(1.3);
}

.swipe-hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.9em;
    margin: 10px 0 20px;
    padding: 10px;
}

/* ===== CALENDARIO ===== */
#calendar{
 margin:20px;background:var(--card);
 border-radius:var(--radius);padding:16px
}
.calendar-head{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 font-size:.7rem;
 font-weight:700;
 color:var(--muted);
 text-align:center;
 margin-top:8px
}
.calendar-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px;
 margin-top:10px
}
.calendar-day{
 font-size:.7rem;text-align:center;
 padding:6px;border-radius:8px;
 background:rgba(0,0,0,.04);
 min-height:70px;
 display:flex;
 flex-direction:column;
 justify-content:flex-start;
}
.day-number{
 font-weight:bold;
 margin-bottom:3px;
}
.weekday{background:rgba(30,136,229,.08);cursor:pointer}
.weekend{background:rgba(0,0,0,.02);color:var(--muted)}
.today-week{outline:2px solid var(--primary)}
body.dark .weekday{background:rgba(30,136,229,.18)}
body.dark .weekend{background:rgba(255,255,255,.03)}
.calendar-day.outside{
 background:rgba(0,0,0,.02);color:var(--muted)
}
.guardia-info{
 font-size:9px;
 line-height:1.2;
 margin-top:2px;
}

/* ===== INFO ===== */
.info-section{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius);
}
.info-section h3{margin-top:0}
.personas-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
 gap:10px;
 margin-top:10px;
}
.persona-item{
 padding:8px 12px;
 border-radius:8px;
 background:rgba(0,0,0,.03);
 display:flex;
 align-items:center;
 gap:8px;
}
.persona-item .icon{font-size:1.2em}

/* ===== HISTORIAL ===== */
#history{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.history-item{
 font-size:.9em;border-bottom:1px dashed rgba(0,0,0,.2);
 padding:6px 0;
 display:flex;
 justify-content:space-between;
}
</style>
</head>
<body>
<button id="night">🌙</button>
<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>
<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>
<div class="container">
<div class="carousel-container">
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="swipe-hint">← Desliza con el dedo →</div>
    <div class="carousel-indicators" id="indicators"></div>
</div>
</div>

<div id="calendar">
<div style="display:flex;justify-content:space-between;align-items:center">
<button onclick="changeMonth(-1)">◀</button>
<h3 id="calendarTitle"></h3>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="info-section">
<h3>👥 Personal Actual</h3>
<div class="personas-grid" id="personasList"></div>
</div>

<div id="history">
<h3>📜 Historial de Guardias</h3>
<div id="historyList"></div>
</div>

<script>
// ========== CONFIGURACIÓN ==========
let electricos = JSON.parse(localStorage.ordenElectricos || '["Fran Ruiz","Hicham","Jose","Abde","Dani","Fran"]');
let mecanicos = JSON.parse(localStorage.ordenMecanicos || '["Ramon","Traian","Manu","Fran Alba","Cele","Santy"]');
let estados = JSON.parse(localStorage.estados || "{}");
let history = JSON.parse(localStorage.history || "[]");
let manualOverrides = JSON.parse(localStorage.manualOverrides || "{}");

// ========== VARIABLES DE CONTROL ==========
let semanaActual = 0; // 0 = esta semana, -1 = semana pasada, +1 = próxima semana
let calendarMonth = new Date();

// ========== FUNCIONES BÁSICAS ==========
function obtenerLunes(fecha) {
    const d = new Date(fecha);
    const dia = d.getDay();
    const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
}

function calcularNumeroSemana(fecha) {
    const lunes = obtenerLunes(fecha);
    const lunesBase = obtenerLunes(new Date(2024, 0, 1));
    const diff = lunes - lunesBase;
    return Math.floor(diff / (7 * 24 * 60 * 60 * 1000));
}

function formatearFecha(fecha) {
    return fecha.toLocaleDateString('es-ES', {
        day: '2-digit',
        month: '2-digit'
    });
}

function obtenerActivos(lista) {
    return lista.filter(persona => !estados[persona] || estados[persona] === "activo");
}

function obtenerGuardia(lista, numeroSemana) {
    const activos = obtenerActivos(lista);
    if (activos.length === 0) return "Nadie";
    
    // Verificar override manual
    const semanaKey = numeroSemana.toString();
    if (manualOverrides[semanaKey]) {
        const tipo = lista === electricos ? 'electrico' : 'mecanico';
        if (manualOverrides[semanaKey][tipo]) {
            return manualOverrides[semanaKey][tipo];
        }
    }
    
    // Rotación automática
    const indice = ((numeroSemana % activos.length) + activos.length) % activos.length;
    return activos[indice];
}

function getEstadoTexto(estado) {
    switch(estado) {
        case 'activo': return 'Activo';
        case 'vacaciones': return 'Vacaciones';
        case 'viaje': return 'Viaje';
        case 'baja': return 'Baja';
        case 'inactivo': return 'Inactivo';
        default: return 'Activo';
    }
}

// ========== RENDERIZAR TODO ==========
function renderizarTodo() {
    renderizarCarousel();
    renderizarCalendario();
    renderizarPersonas();
    renderizarHistorial();
}

// ========== CARRUSEL ==========
function renderizarCarousel() {
    const hoy = new Date();
    const numeroSemanaHoy = calcularNumeroSemana(hoy);
    
    // Calcular el lunes de la semana actual
    const lunesActual = obtenerLunes(hoy);
    lunesActual.setDate(lunesActual.getDate() + (semanaActual * 7));
    
    let carouselHTML = '';
    let indicatorsHTML = '';
    
    // Crear 3 slides: anterior, actual, siguiente
    for (let i = -1; i <= 1; i++) {
        const desplazamiento = semanaActual + i;
        const numeroSemana = numeroSemanaHoy + desplazamiento;
        
        // Calcular fechas de esta semana
        const inicio = new Date(lunesActual);
        inicio.setDate(inicio.getDate() + (i * 7));
        const fin = new Date(inicio);
        fin.setDate(fin.getDate() + 4);
        
        // Obtener guardias
        const electrico = obtenerGuardia(electricos, numeroSemana);
        const mecanico = obtenerGuardia(mecanicos, numeroSemana);
        const tieneOverride = manualOverrides[numeroSemana.toString()];
        
        // Renderizar slide
        carouselHTML += `
            <div class="carousel-slide">
                <div class="card">
                    <h3>${formatearFecha(inicio)} - ${formatearFecha(fin)} ${tieneOverride ? '🔄' : ''}</h3>
                    <div class="guardias">
                        <div class="guardia">
                            <div class="icono">⚡</div>
                            <div class="nombre">${electrico}</div>
                            <div class="days">L–V</div>
                            <div class="time">15:30 – 19:00</div>
                            <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">
                                ${getEstadoTexto(estados[electrico] || 'activo')}
                            </small>
                        </div>
                        <div class="guardia">
                            <div class="icono">🔧</div>
                            <div class="nombre">${mecanico}</div>
                            <div class="days">L–V</div>
                            <div class="time">15:30 – 19:00</div>
                            <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">
                                ${getEstadoTexto(estados[mecanico] || 'activo')}
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        // Renderizar indicador
        indicatorsHTML += `<div class="carousel-indicator ${i === 0 ? 'active' : ''}"></div>`;
    }
    
    // Actualizar DOM
    const track = document.getElementById('carouselTrack');
    track.innerHTML = carouselHTML;
    document.getElementById('indicators').innerHTML = indicatorsHTML;
    
    // Actualizar subtítulo con fecha actual
    const inicioActual = new Date(lunesActual);
    const finActual = new Date(inicioActual);
    finActual.setDate(finActual.getDate() + 4);
    document.getElementById('subtitle').textContent = 
        `${formatearFecha(inicioActual)} - ${formatearFecha(finActual)}`;
    
    // Posicionar carrusel en slide central
    setTimeout(() => {
        track.style.transform = `translateX(-33.333%)`;
    }, 50);
}

// ========== CARRUSEL TÁCTIL ==========
function configurarCarouselTactil() {
    const track = document.getElementById('carouselTrack');
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    let translateX = 0;
    
    // Touch events
    track.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].clientX;
        track.style.transition = 'none';
        e.preventDefault();
    });
    
    track.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        
        currentX = e.touches[0].clientX;
        const diff = currentX - startX;
        
        // Mover el carrusel
        translateX = -33.333 + (diff / window.innerWidth * 100);
        track.style.transform = `translateX(${translateX}%)`;
        
        e.preventDefault();
    });
    
    track.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        
        const diff = currentX - startX;
        const threshold = window.innerWidth * 0.15; // 15% del ancho
        
        if (Math.abs(diff) > threshold) {
            if (diff > 0) {
                // Deslizó a la derecha -> semana anterior
                semanaActual--;
            } else {
                // Deslizó a la izquierda -> semana siguiente
                semanaActual++;
            }
            renderizarTodo();
        } else {
            // Volver a posición central
            track.style.transition = 'transform 0.3s ease';
            track.style.transform = `translateX(-33.333%)`;
        }
    });
    
    // Mouse events para pruebas
    track.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        track.style.transition = 'none';
        e.preventDefault();
    });
    
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        currentX = e.clientX;
        const diff = currentX - startX;
        translateX = -33.333 + (diff / window.innerWidth * 100);
        track.style.transform = `translateX(${translateX}%)`;
    });
    
    document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        
        const diff = currentX - startX;
        const threshold = window.innerWidth * 0.15;
        
        if (Math.abs(diff) > threshold) {
            if (diff > 0) {
                semanaActual--;
            } else {
                semanaActual++;
            }
            renderizarTodo();
        } else {
            track.style.transition = 'transform 0.3s ease';
            track.style.transform = `translateX(-33.333%)`;
        }
    });
}

// ========== CALENDARIO ==========
function renderizarCalendario() {
    const año = calendarMonth.getFullYear();
    const mes = calendarMonth.getMonth();
    
    // Actualizar título
    const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                   'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    document.getElementById('calendarTitle').textContent = `${meses[mes]} ${año}`;
    
    // Calcular primer y último día
    const primerDia = new Date(año, mes, 1);
    const ultimoDia = new Date(año, mes + 1, 0);
    
    // Calcular inicio del calendario
    const inicio = new Date(primerDia);
    const diaInicio = inicio.getDay();
    const diasAtras = diaInicio === 0 ? 6 : diaInicio - 1;
    inicio.setDate(inicio.getDate() - diasAtras);
    
    // Calcular fin del calendario
    const fin = new Date(ultimoDia);
    const diaFin = fin.getDay();
    const diasAdelante = diaFin === 0 ? 0 : 7 - diaFin;
    fin.setDate(fin.getDate() + diasAdelante);
    
    // Generar días
    let htmlCalendario = '';
    let fechaActual = new Date(inicio);
    
    while (fechaActual <= fin) {
        const mesDia = fechaActual.getMonth();
        const esMesActual = mesDia === mes;
        const esFinSemana = fechaActual.getDay() === 0 || fechaActual.getDay() === 6;
        const esDiaLaboral = fechaActual.getDay() >= 1 && fechaActual.getDay() <= 5;
        
        // Calcular semana y guardias
        const semana = calcularNumeroSemana(fechaActual);
        const electrico = obtenerGuardia(electricos, semana);
        const mecanico = obtenerGuardia(mecanicos, semana);
        const tieneOverride = manualOverrides[semana.toString()];
        
        let contenido = `<div class="day-number">${fechaActual.getDate()}</div>`;
        
        if (esDiaLaboral && esMesActual) {
            contenido += `
                <div class="guardia-info">
                    <div style="color: ${tieneOverride ? '#8b5cf6' : '#10b981'}">⚡ ${electrico}</div>
                    <div style="color: ${tieneOverride ? '#8b5cf6' : '#10b981'}">🔧 ${mecanico}</div>
                </div>
            `;
        }
        
        const clases = [
            'calendar-day',
            esMesActual ? '' : 'outside',
            esFinSemana ? 'weekend' : 'weekday'
        ].filter(c => c).join(' ');
        
        htmlCalendario += `<div class="${clases}">${contenido}</div>`;
        
        fechaActual.setDate(fechaActual.getDate() + 1);
    }
    
    document.getElementById('calendarGrid').innerHTML = htmlCalendario;
}

function changeMonth(delta) {
    calendarMonth.setMonth(calendarMonth.getMonth() + delta);
    renderizarCalendario();
}

// ========== PERSONAS ==========
function renderizarPersonas() {
    let html = '';
    
    // Eléctricos
    electricos.forEach(persona => {
        const estado = estados[persona] || 'activo';
        if (estado !== 'inactivo') {
            const color = estado === 'activo' ? '#10b981' :
                         estado === 'vacaciones' ? '#f59e0b' :
                         estado === 'viaje' ? '#8b5cf6' :
                         estado === 'baja' ? '#ef4444' : '#6b7280';
            
            html += `
                <div class="persona-item">
                    <span class="icon">⚡</span>
                    <span>${persona}</span>
                    <span style="margin-left: auto; font-size: 0.8em; color: ${color}">
                        ${getEstadoTexto(estado)}
                    </span>
                </div>
            `;
        }
    });
    
    // Mecánicos
    mecanicos.forEach(persona => {
        const estado = estados[persona] || 'activo';
        if (estado !== 'inactivo') {
            const color = estado === 'activo' ? '#10b981' :
                         estado === 'vacaciones' ? '#f59e0b' :
                         estado === 'viaje' ? '#8b5cf6' :
                         estado === 'baja' ? '#ef4444' : '#6b7280';
            
            html += `
                <div class="persona-item">
                    <span class="icon">🔧</span>
                    <span>${persona}</span>
                    <span style="margin-left: auto; font-size: 0.8em; color: ${color}">
                        ${getEstadoTexto(estado)}
                    </span>
                </div>
            `;
        }
    });
    
    document.getElementById('personasList').innerHTML = html;
}

// ========== HISTORIAL ==========
function renderizarHistorial() {
    let html = '';
    
    history.slice(0, 10).forEach(item => {
        const [fecha, ...guardias] = item.split(' ');
        html += `
            <div class="history-item">
                <span>${fecha}</span>
                <span>${guardias.join(' ')}</span>
            </div>
        `;
    });
    
    document.getElementById('historyList').innerHTML = html;
}

// ========== EVENT LISTENERS ==========
document.getElementById('prev').addEventListener('click', () => {
    semanaActual--;
    renderizarTodo();
});

document.getElementById('next').addEventListener('click', () => {
    semanaActual++;
    renderizarTodo();
});

document.getElementById('night').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('darkMode', document.body.classList.contains('dark'));
});

// ========== INICIALIZACIÓN ==========
function inicializar() {
    // Tema oscuro
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }
    
    // Renderizar todo
    renderizarTodo();
    
    // Configurar carrusel táctil
    setTimeout(configurarCarouselTactil, 100);
}

// Iniciar
document.addEventListener('DOMContentLoaded', inicializar);
</script>
</body>
</html>
