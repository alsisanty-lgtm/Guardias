<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guardias Alsi</title>
<style>
:root{
 --primary:#1e88e5;--bg:#f2f4f8;--card:#fff;
 --text:#1f2937;--muted:#6b7280;
 --shadow:0 10px 25px rgba(0,0,0,.12);
 --radius:18px;
}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af}
body{
 margin:0;
 font-family:system-ui;
 background:var(--bg);
 color:var(--text);
 -webkit-tap-highlight-color: transparent;
}
header{
 background:linear-gradient(135deg,#1e88e5,#1565c0);
 color:#fff;
 padding:20px;
 text-align:center;
}
button{
 background:var(--primary);
 color:#fff;
 border:none;
 padding:12px 18px;
 border-radius:14px;
 font-weight:700;
 cursor:pointer;
}
#night{position:fixed;top:12px;right:12px;z-index:200}
.nav{display:flex;justify-content:space-between;padding:10px}
.container{max-width:960px;margin:auto;padding:10px}

/* ===== CARRUSEL SIMPLE ===== */
.carousel-container {
 position: relative;
 width: 100%;
 overflow: hidden;
}

.carousel {
 display: flex;
 transition: transform 0.3s ease;
 width: 300%; /* 3 semanas */
}

.card {
 flex: 0 0 33.333%; /* Cada tarjeta ocupa 1/3 del contenedor */
 padding: 20px;
 box-sizing: border-box;
}

.guardias{
 display:flex;
 gap:14px;
 margin-top:14px;
}
.guardia{
 flex:1;
 text-align:center;
 background:rgba(0,0,0,.05);
 border-radius:14px;
 padding:14px;
}
body.dark .guardia{background:rgba(255,255,255,.06)}
.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted)}
.time{font-weight:700;font-size:.9em}
.status-active{color:#10b981}
.status-vacaciones{color:#f59e0b}
.status-viaje{color:#8b5cf6}
.status-baja{color:#ef4444}
.status-inactivo{color:#6b7280}

/* ===== CALENDARIO ===== */
#calendar{
 margin:20px;background:var(--card);
 border-radius:var(--radius);padding:16px
}
.calendar-head{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 font-size:.7rem;
 font-weight:700;
 color:var(--muted);
 text-align:center;
 margin-top:8px
}
.calendar-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px;
 margin-top:10px
}
.calendar-day{
 font-size:.7rem;text-align:center;
 padding:6px;border-radius:8px;
 background:rgba(0,0,0,.04);
 min-height:70px;
 display:flex;
 flex-direction:column;
 justify-content:flex-start;
}
.day-number{
 font-weight:bold;
 margin-bottom:3px;
}
.weekday{background:rgba(30,136,229,.08);cursor:pointer}
.weekend{background:rgba(0,0,0,.02);color:var(--muted)}
.today-week{outline:2px solid var(--primary)}
body.dark .weekday{background:rgba(30,136,229,.18)}
body.dark .weekend{background:rgba(255,255,255,.03)}
.calendar-day.outside{
 background:rgba(0,0,0,.02);color:var(--muted)
}
.guardia-info{
 font-size:9px;
 line-height:1.2;
 margin-top:2px;
}

/* ===== INFO ===== */
.info-section{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius);
}
.info-section h3{margin-top:0}
.personas-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
 gap:10px;
 margin-top:10px;
}
.persona-item{
 padding:8px 12px;
 border-radius:8px;
 background:rgba(0,0,0,.03);
 display:flex;
 align-items:center;
 gap:8px;
}
.persona-item .icon{font-size:1.2em}

/* ===== HISTORIAL ===== */
#history{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.history-item{
 font-size:.9em;border-bottom:1px dashed rgba(0,0,0,.2);
 padding:6px 0;
 display:flex;
 justify-content:space-between;
}
</style>
</head>
<body>
<button id="night">🌙</button>
<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>
<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>
<div class="container">
<div class="carousel-container">
 <div class="carousel" id="carousel"></div>
</div>
<div style="text-align:center;color:#666;font-size:0.9em;margin-top:10px;">
 ← Desliza con el dedo →
</div>
</div>

<div id="calendar">
<div style="display:flex;justify-content:space-between;align-items:center">
<button onclick="changeMonth(-1)">◀</button>
<h3 id="calendarTitle"></h3>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="info-section">
<h3>👥 Personal Actual</h3>
<div class="personas-grid" id="personasList"></div>
</div>

<div id="history">
<h3>📜 Historial de Guardias</h3>
<div id="historyList"></div>
</div>

<script>
// ========== VARIABLES GLOBALES ==========
let electricos = ["Fran Ruiz", "Hicham", "Jose", "Abde", "Dani", "Fran"];
let mecanicos = ["Ramon", "Traian", "Manu", "Fran Alba", "Cele", "Santy"];
let estados = JSON.parse(localStorage.estados || "{}");
let history = JSON.parse(localStorage.history || "[]");
let manualOverrides = JSON.parse(localStorage.manualOverrides || "{}");
let offset = 0;
let calendarMonth = new Date();

// Variables para el carrusel táctil
let startX = 0;
let currentX = 0;
let carousel = document.getElementById('carousel');
let isDragging = false;

// ========== FUNCIONES BÁSICAS ==========
const FECHA_BASE = new Date(2024, 0, 1);
const MS_POR_SEMANA = 7 * 24 * 60 * 60 * 1000;

function obtenerLunes(fecha) {
 const d = new Date(fecha);
 const dia = d.getDay();
 const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
 return new Date(d.setDate(diff));
}

function calcularNumeroSemana(fecha) {
 const fechaLunes = obtenerLunes(fecha);
 const fechaBaseLunes = obtenerLunes(FECHA_BASE);
 const diferenciaMs = fechaLunes - fechaBaseLunes;
 return Math.floor(diferenciaMs / MS_POR_SEMANA);
}

const fd = d => {
 const date = new Date(d);
 return date.toLocaleDateString('es-ES', {
  day: '2-digit',
  month: '2-digit'
 });
};

const activos = l => l.filter(p => !estados[p] || estados[p] === "activo");

const guardia = (l, numeroSemana) => {
 const a = activos(l);
 if (a.length === 0) return "Nadie";
 
 const semanaKey = numeroSemana.toString();
 if (manualOverrides[semanaKey]) {
  const tipo = l === electricos ? 'electrico' : 'mecanico';
  if (manualOverrides[semanaKey][tipo]) {
   return manualOverrides[semanaKey][tipo];
  }
 }
 
 const indice = ((numeroSemana % a.length) + a.length) % a.length;
 return a[indice];
};

// ========== RENDERIZAR CARRUSEL ==========
function render() {
 const hoy = new Date();
 const numeroSemanaActual = calcularNumeroSemana(hoy);
 
 const fechaBase = obtenerLunes(hoy);
 fechaBase.setDate(fechaBase.getDate() + (offset * 7));
 
 const fechaInicio = new Date(fechaBase);
 const fechaFin = new Date(fechaInicio);
 fechaFin.setDate(fechaFin.getDate() + 4);
 
 document.getElementById('subtitle').textContent = `${fd(fechaInicio)} - ${fd(fechaFin)}`;
 
 let carouselHTML = '';
 
 // Crear 3 semanas: anterior, actual, siguiente
 for (let i = -1; i <= 1; i++) {
  const semanaOffset = offset + i;
  const numeroSemana = numeroSemanaActual + semanaOffset;
  
  const semanaInicio = new Date(fechaBase);
  semanaInicio.setDate(semanaInicio.getDate() + (i * 7));
  const semanaFin = new Date(semanaInicio);
  semanaFin.setDate(semanaFin.getDate() + 4);
  
  const elecGuardia = guardia(electricos, numeroSemana);
  const mecGuardia = guardia(mecanicos, numeroSemana);
  const tieneOverride = manualOverrides[numeroSemana.toString()];
  
  carouselHTML += `
   <div class="card">
    <h3>${fd(semanaInicio)} - ${fd(semanaFin)} ${tieneOverride ? '🔄' : ''}</h3>
    <div class="guardias">
     <div class="guardia">
      <div class="icono">⚡</div>
      <div class="nombre">${elecGuardia}</div>
      <div class="days">L–V</div>
      <div class="time">15:30 – 19:00</div>
     </div>
     <div class="guardia">
      <div class="icono">🔧</div>
      <div class="nombre">${mecGuardia}</div>
      <div class="days">L–V</div>
      <div class="time">15:30 – 19:00</div>
     </div>
    </div>
   </div>
  `;
 }
 
 carousel.innerHTML = carouselHTML;
 
 // Posicionar en la tarjeta del medio
 carousel.style.transform = `translateX(-33.333%)`;
 
 renderHistory();
}

// ========== CARRUSEL TÁCTIL - VERSIÓN SUPER SIMPLE ==========
function setupTouchCarousel() {
 carousel = document.getElementById('carousel');
 
 // Touch start
 carousel.addEventListener('touchstart', (e) => {
  isDragging = true;
  startX = e.touches[0].clientX;
  currentX = startX;
  carousel.style.transition = 'none';
 });
 
 // Touch move
 carousel.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  
  currentX = e.touches[0].clientX;
  const diff = currentX - startX;
  
  // Mover el carrusel proporcionalmente al desplazamiento
  const movePercent = (diff / window.innerWidth) * 100;
  carousel.style.transform = `translateX(calc(-33.333% + ${movePercent}%))`;
 });
 
 // Touch end
 carousel.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  carousel.style.transition = 'transform 0.3s ease';
  
  const diff = currentX - startX;
  const threshold = 50; // 50px mínimo para cambiar
  
  if (Math.abs(diff) > threshold) {
   if (diff > 0) {
    // Deslizó a la derecha -> semana anterior
    offset--;
   } else {
    // Deslizó a la izquierda -> semana siguiente
    offset++;
   }
   render();
  } else {
   // Volver a la posición central
   carousel.style.transform = `translateX(-33.333%)`;
  }
 });
 
 // También para ratón
 carousel.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX;
  currentX = startX;
  carousel.style.transition = 'none';
 });
 
 document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  currentX = e.clientX;
  const diff = currentX - startX;
  const movePercent = (diff / window.innerWidth) * 100;
  carousel.style.transform = `translateX(calc(-33.333% + ${movePercent}%))`;
 });
 
 document.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  carousel.style.transition = 'transform 0.3s ease';
  
  const diff = currentX - startX;
  const threshold = 50;
  
  if (Math.abs(diff) > threshold) {
   if (diff > 0) {
    offset--;
   } else {
    offset++;
   }
   render();
  } else {
   carousel.style.transform = `translateX(-33.333%)`;
  }
 });
}

// ========== CALENDARIO ==========
function renderCalendar() {
 document.getElementById('calendarGrid').innerHTML = "";
 const y = calendarMonth.getFullYear();
 const m = calendarMonth.getMonth();
 
 document.getElementById('calendarTitle').textContent = 
  `📆 ${calendarMonth.toLocaleString("es", { month: "long" })}, ${y}`;
 
 const primerDia = new Date(y, m, 1);
 const ultimoDia = new Date(y, m + 1, 0);
 
 const inicio = new Date(primerDia);
 const diaSemana = inicio.getDay();
 const diasAtras = diaSemana === 0 ? 6 : diaSemana - 1;
 inicio.setDate(inicio.getDate() - diasAtras);
 
 const fin = new Date(ultimoDia);
 const diaSemanaFin = fin.getDay();
 const diasAdelante = diaSemanaFin === 0 ? 0 : 7 - diaSemanaFin;
 fin.setDate(fin.getDate() + diasAdelante);
 
 let fechaActual = new Date(inicio);
 while (fechaActual <= fin) {
  const esMesAnterior = fechaActual.getMonth() < m;
  const esMesSiguiente = fechaActual.getMonth() > m;
  const esFueraMes = esMesAnterior || esMesSiguiente;
  const diaSemana = fechaActual.getDay();
  const esDiaLaboral = diaSemana >= 1 && diaSemana <= 5;
  
  const numeroSemana = calcularNumeroSemana(fechaActual);
  const elecGuardia = guardia(electricos, numeroSemana);
  const mecGuardia = guardia(mecanicos, numeroSemana);
  
  let contenidoHTML = `<div class="day-number">${fechaActual.getDate()}</div>`;
  
  if (esDiaLaboral && !esFueraMes) {
   contenidoHTML += `
    <div class="guardia-info">
     <div>⚡ ${elecGuardia}</div>
     <div>🔧 ${mecGuardia}</div>
    </div>
   `;
  }
  
  const clases = [
   'calendar-day',
   esFueraMes ? 'outside' : '',
   esDiaLaboral ? 'weekday' : 'weekend'
  ].filter(c => c).join(' ');
  
  document.getElementById('calendarGrid').innerHTML += `
   <div class="${clases}">
    ${contenidoHTML}
   </div>
  `;
  
  fechaActual.setDate(fechaActual.getDate() + 1);
 }
}

function changeMonth(delta) {
 calendarMonth.setMonth(calendarMonth.getMonth() + delta);
 renderCalendar();
}

// ========== PERSONAS ==========
function renderPersonasList() {
 let html = '';
 
 electricos.forEach(persona => {
  const estado = estados[persona] || 'activo';
  if (estado !== 'inactivo') {
   html += `
    <div class="persona-item">
     <span class="icon">⚡</span>
     <span>${persona}</span>
    </div>`;
  }
 });
 
 mecanicos.forEach(persona => {
  const estado = estados[persona] || 'activo';
  if (estado !== 'inactivo') {
   html += `
    <div class="persona-item">
     <span class="icon">🔧</span>
     <span>${persona}</span>
    </div>`;
  }
 });
 
 document.getElementById('personasList').innerHTML = html;
}

// ========== HISTORIAL ==========
function logCompletedWeek() {
 const hoy = new Date();
 const viernes = obtenerLunes(hoy);
 viernes.setDate(viernes.getDate() + 4);
 
 if (hoy < viernes) return;
 
 const numeroSemana = calcularNumeroSemana(hoy);
 const clave = fd(obtenerLunes(hoy));
 
 if (history.some(h => h.startsWith(clave))) return;
 
 const elecGuardia = guardia(electricos, numeroSemana);
 const mecGuardia = guardia(mecanicos, numeroSemana);
 
 history.unshift(`${clave} ⚡ ${elecGuardia} · 🔧 ${mecGuardia}`);
 history = history.slice(0, 30);
 localStorage.history = JSON.stringify(history);
}

function renderHistory() {
 const historyList = document.getElementById('historyList');
 historyList.innerHTML = "";
 
 history.forEach(h => {
  const [fecha, ...resto] = h.split(' ');
  const guardias = resto.join(' ');
  historyList.innerHTML += `
   <div class="history-item">
    <span>${fecha}</span>
    <span>${guardias}</span>
   </div>
  `;
 });
}

// ========== BOTONES DE NAVEGACIÓN ==========
document.getElementById('prev').addEventListener('click', () => {
 offset--;
 render();
});

document.getElementById('next').addEventListener('click', () => {
 offset++;
 render();
});

// ========== MODO OSCURO ==========
document.getElementById('night').addEventListener('click', () => {
 document.body.classList.toggle("dark");
 localStorage.dark = document.body.classList.contains("dark");
});

if (localStorage.dark === "true") document.body.classList.add("dark");

// ========== INICIALIZACIÓN ==========
function init() {
 renderCalendar();
 renderPersonasList();
 logCompletedWeek();
 render();
 
 // Configurar carrusel después de un pequeño delay
 setTimeout(setupTouchCarousel, 100);
}

// Iniciar cuando el DOM esté listo
if (document.readyState === 'loading') {
 document.addEventListener('DOMContentLoaded', init);
} else {
 init();
}
</script>
</body>
</html>
