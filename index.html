<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi PRO</title>

<link rel="manifest" href="/Guardias/manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="/Guardias/icon-192.png">

<style>
:root{
 --primary:#1e88e5;--bg:#f2f4f8;--card:#fff;
 --text:#1f2937;--muted:#6b7280;
 --shadow:0 10px 25px rgba(0,0,0,.12);
 --radius:18px;
}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}

header{
 background:linear-gradient(135deg,#1e88e5,#1565c0);
 color:#fff;padding:20px;text-align:center;
 position:sticky;top:0;z-index:100
}

button{
 background:var(--primary);color:#fff;border:none;
 padding:10px 16px;border-radius:14px;font-weight:700
}

#night{position:fixed;top:12px;right:12px;z-index:200}

.nav{display:flex;justify-content:space-between;padding:10px}

.container{max-width:960px;margin:auto;padding:10px}

.carousel{
 display:flex;gap:14px;overflow-x:auto;
 scroll-snap-type:x mandatory;
 -webkit-overflow-scrolling:touch
}

.card{
 min-width:320px;background:var(--card);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 padding:20px;scroll-snap-align:center
}

.guardias{display:flex;gap:14px;margin-top:14px}
.guardia{
 flex:1;text-align:center;
 background:rgba(0,0,0,.05);
 border-radius:14px;padding:14px
}
body.dark .guardia{background:rgba(255,255,255,.06)}

.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted);margin-top:6px}
.time{font-weight:700;font-size:.9em;margin-top:4px}

/* ===== CALENDARIO ===== */
#calendar{
 margin:20px;background:var(--card);
 border-radius:var(--radius);
 padding:16px
}
.calendar-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:6px;margin-top:10px
}
.cal-day{
 padding:8px;border-radius:10px;
 font-size:.8em;text-align:center;
 background:rgba(0,0,0,.05);
 cursor:pointer
}
body.dark .cal-day{background:rgba(255,255,255,.06)}
.cal-day strong{display:block;font-size:.75em}
.cal-header{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 text-align:center;
 font-size:.75em;color:var(--muted)
}

/* ===== ADMIN ===== */
details{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.admin-person{
 display:flex;align-items:center;
 justify-content:space-between;
 border-bottom:1px solid rgba(0,0,0,.1);
 padding:6px 0
}
select{border-radius:10px;padding:5px}
.order button{padding:4px 8px;font-size:12px}

/* ===== HISTORIAL ===== */
#history{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.history-item{
 font-size:.9em;border-bottom:1px dashed rgba(0,0,0,.2);
 padding:6px 0
}
</style>
</head>

<body>

<button id="night">🌙</button>

<header>
<h1>Guardias Alsi PRO</h1>
<div id="subtitle"></div>
</header>

<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>

<div class="container">
<div class="carousel" id="carousel"></div>
</div>

<!-- 📆 CALENDARIO -->
<div id="calendar">
<div style="display:flex;justify-content:space-between;align-items:center">
  <button onclick="changeMonth(-1)">◀</button>
  <h3 id="calendarTitle">📆 Calendario mensual</h3>
  <button onclick="changeMonth(1)">▶</button>
</div>

<div class="cal-header">
<div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- ADMIN -->
<details id="admin">
<summary>⚙️ Administrador</summary>

<h3>⚡ Eléctricos</h3>
<div id="admin-elec"></div>

<h3>🔧 Mecánicos</h3>
<div id="admin-mec"></div>

<br><button id="save">💾 Guardar</button>
</details>

<div id="history">
<h3>📜 Historial real</h3>
<div id="historyList"></div>
</div>

<script>
/* ===================== MODO NOCHE ===================== */
night.onclick=()=>{
 document.body.classList.toggle("dark");
 localStorage.dark=document.body.classList.contains("dark");
};
if(localStorage.dark==="true")document.body.classList.add("dark");

/* ===================== ADMIN ===================== */
const ADMIN_PASS="alsi2026";
let unlocked=false;
setTimeout(()=>{
 const p=prompt("Contraseña admin");
 if(p!==ADMIN_PASS)admin.style.display="none";
},300);

/* ===================== DATOS ===================== */
let electricos=["Abde","Fran","Dani","Jose","Fran Ruiz","Hicham"];
let mecanicos=["Ramon","Santy","Traian","Manu","Fran Alba","Cele"];
let estados=JSON.parse(localStorage.estados||"{}");
let history=JSON.parse(localStorage.history||"[]");
let lastLoggedWeek=localStorage.lastLoggedWeek||"";
let offset=0;
let calendarMonth = new Date(); // mes que se está mostrando

try{electricos=JSON.parse(localStorage.electricos)||electricos}catch{}
try{mecanicos=JSON.parse(localStorage.mecanicos)||mecanicos}catch{}

/* ===================== FECHAS ===================== */
const lunes=d=>{
 d=new Date(d);let n=d.getDay();
 d.setDate(d.getDate()-(n===0?6:n-1));return d;
};
const fd=d=>d.toLocaleDateString();

/* ===================== GUARDIAS ===================== */
const activos=l=>l.filter(p=>!estados[p]||estados[p]==="activo");
const guardia=(l,o)=>{
 const a=activos(l);
 return a.length?a[((o%a.length)+a.length)%a.length]:"Nadie";
};

/* ===================== CALENDARIO ===================== */
function renderCalendar(){
 const g=document.getElementById("calendarGrid");
 const title=document.getElementById("calendarTitle");
 g.innerHTML="";

 const year=calendarMonth.getFullYear();
 const month=calendarMonth.getMonth();

 const monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
 title.textContent=`📆 ${monthNames[month]} ${year}`;

 const firstDay=new Date(year,month,1);
 const start=lunes(firstDay);

 for(let i=0;i<42;i++){
  const d=new Date(start);
  d.setDate(start.getDate()+i);

  const weekOffset=Math.floor((lunes(d)-lunes(new Date()))/604800000);

  g.innerHTML+=`
  <div class="cal-day" onclick="offset=${weekOffset};render()">
   ${d.getDate()}
   <strong>⚡ ${guardia(electricos,weekOffset)}</strong>
   <strong>🔧 ${guardia(mecanicos,weekOffset)}</strong>
  </div>`;
 }
}
function changeMonth(delta){
  calendarMonth.setMonth(calendarMonth.getMonth() + delta);
  renderCalendar();
}


/* ===================== RENDER ===================== */
function render(){
 carousel.innerHTML="";
 const base=lunes(new Date());
 const ini=new Date(base);ini.setDate(ini.getDate()+offset*7);
 const fin=new Date(ini);fin.setDate(fin.getDate()+4);
 subtitle.textContent=`${fd(ini)} - ${fd(fin)}`;

 for(let i=-1;i<=1;i++){
  const l=new Date(ini);l.setDate(l.getDate()+i*7);
  const v=new Date(l);v.setDate(v.getDate()+4);
  const e=guardia(electricos,offset+i);
  const m=guardia(mecanicos,offset+i);

  if(i===0){
   const key=fd(l);
   if(key!==lastLoggedWeek){
    history.unshift(`${key} ⚡ ${e} · 🔧 ${m}`);
    history=history.slice(0,30);
    localStorage.history=JSON.stringify(history);
    localStorage.lastLoggedWeek=key;
   }
  }

  carousel.innerHTML+=`
  <div class="card">
   <h3>${fd(l)} - ${fd(v)}</h3>
   <div class="guardias">
    <div class="guardia">
     <div class="icono">⚡</div>
     <div class="nombre">${e}</div>
     <div class="days">Lun · Mar · Mié · Jue · Vie</div>
     <div class="time">⏰ 15:30 – 19:00</div>
    </div>
    <div class="guardia">
     <div class="icono">🔧</div>
     <div class="nombre">${m}</div>
     <div class="days">Lun · Mar · Mié · Jue · Vie</div>
     <div class="time">⏰ 15:30 – 19:00</div>
    </div>
   </div>
  </div>`;
 }

 renderHistory();
 requestAnimationFrame(()=>{
  carousel.scrollLeft=carousel.children[0].offsetWidth+14;
 });
}

/* ===================== HISTORIAL ===================== */
function renderHistory(){
 historyList.innerHTML="";
 history.forEach(h=>{
  historyList.innerHTML+=`<div class="history-item">${h}</div>`;
 });
}

/* ===================== ADMIN ===================== */
function renderAdmin(){
 [["elec",electricos],["mec",mecanicos]].forEach(([id,list])=>{
  const c=document.getElementById("admin-"+id);
  c.innerHTML="";
  list.forEach((p,i)=>{
   c.innerHTML+=`
   <div class="admin-person">
    ${p}
    <div class="order">
     <button onclick="move('${id}',${i},-1)">▲</button>
     <button onclick="move('${id}',${i},1)">▼</button>
     <select onchange="estados['${p}']=this.value">
      <option value="activo">Activo</option>
      <option value="vacaciones">Vacaciones</option>
      <option value="baja">Baja</option>
      <option value="viaje">Viaje</option>
     </select>
    </div>
   </div>`;
  });
 });
}
function move(t,i,d){
 const l=t==="elec"?electricos:mecanicos;
 const n=i+d;if(n<0||n>=l.length)return;
 [l[i],l[n]]=[l[n],l[i]];
 renderAdmin();render();
}

prev.onclick=()=>{offset--;render()};
next.onclick=()=>{offset++;render()};
save.onclick=()=>{
 localStorage.electricos=JSON.stringify(electricos);
 localStorage.mecanicos=JSON.stringify(mecanicos);
 localStorage.estados=JSON.stringify(estados);
 alert("Guardado");
};

/* ===================== INIT ===================== */
renderAdmin();
renderCalendar();
render();
</script>

</body>
</html>
