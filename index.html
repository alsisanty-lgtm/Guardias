<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi - Usuarios</title>

<!-- ========== META TAGS PWA ========== -->
<meta name="theme-color" content="#1e88e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guardias Alsi">
<link rel="apple-touch-icon" href="icon-152.png">
<meta name="msapplication-TileImage" content="icon-144.png">
<meta name="msapplication-TileColor" content="#1e88e5">
<meta name="msapplication-config" content="browserconfig.xml">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<style>
:root{
 --primary:#1e88e5;--bg:#f2f4f8;--card:#fff;
 --text:#1f2937;--muted:#6b7280;
 --shadow:0 10px 25px rgba(0,0,0,.12);
 --radius:18px;
}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
header{
 background:linear-gradient(135deg,#1e88e5,#1565c0);
 color:#fff;padding:20px;text-align:center;
 position:sticky;top:0;z-index:100
}
button{
 background:var(--primary);color:#fff;border:none;
 padding:10px 16px;border-radius:14px;font-weight:700;
 cursor:pointer;
 transition:opacity 0.3s;
}
button:hover{opacity:0.9}
button.secondary{
 background:#6b7280;
}
#night{position:fixed;top:12px;right:12px;z-index:200}
.nav{display:flex;justify-content:space-between;padding:10px}
.container{max-width:960px;margin:auto;padding:10px}
.carousel{
 display:flex;gap:14px;overflow-x:auto;
 scroll-snap-type:x mandatory;
 padding-bottom:10px;
}
.card{
 min-width:320px;background:var(--card);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 padding:20px;scroll-snap-align:center;
 position:relative;
}
.guardias{display:flex;gap:14px;margin-top:14px}
.guardia{
 flex:1;text-align:center;
 background:rgba(0,0,0,.05);
 border-radius:14px;padding:14px;
 position:relative;
}
body.dark .guardia{background:rgba(255,255,255,.06)}
.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted)}
.time{font-weight:700;font-size:.9em}
.status-active{color:#10b981}
.status-vacaciones{color:#f59e0b}
.status-viaje{color:#8b5cf6}
.status-baja{color:#ef4444}
.status-inactivo{color:#6b7280}

/* ===== CALENDARIO ===== */
#calendar{
 margin:20px;background:var(--card);
 border-radius:var(--radius);padding:16px
}
.calendar-head{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 font-size:.7rem;
 font-weight:700;
 color:var(--muted);
 text-align:center;
 margin-top:8px
}
.calendar-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px;
 margin-top:10px
}
.calendar-day{
 font-size:.7rem;text-align:center;
 padding:6px;border-radius:8px;
 background:rgba(0,0,0,.04);
 min-height:70px;
 display:flex;
 flex-direction:column;
 justify-content:flex-start;
}
.day-number{
 font-weight:bold;
 margin-bottom:3px;
}
.weekday{background:rgba(30,136,229,.08);cursor:pointer}
.weekend{background:rgba(0,0,0,.02);color:var(--muted)}
.today-week{outline:2px solid var(--primary)}
body.dark .weekday{background:rgba(30,136,229,.18)}
body.dark .weekend{background:rgba(255,255,255,.03)}
.calendar-day.outside{
 background:rgba(0,0,0,.02);color:var(--muted)
}
.guardia-info{
 font-size:9px;
 line-height:1.2;
 margin-top:2px;
}

/* ===== HISTORIAL ===== */
#history{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.history-item{
 font-size:.9em;border-bottom:1px dashed rgba(0,0,0,.2);
 padding:6px 0
}

@media(max-width:480px){
 .calendar-day{font-size:.6rem;min-height:60px}
}

/* ========== ESTILOS PWA ========== */
.standalone-mode header {
  padding-top: env(safe-area-inset-top, 20px);
}
.standalone-mode #night {
  top: calc(env(safe-area-inset-top, 12px) + 12px);
}
@media (display-mode: standalone) {
  button, .calendar-day { min-height: 44px; }
  .guardia { padding: 20px; }
  body { -webkit-tap-highlight-color: transparent; }
}

/* ===== NOTIFICACIONES ===== */
.notificacion-github {
  position: fixed;
  top: 70px;
  right: 10px;
  background: #4CAF50;
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  z-index: 10000;
  font-size: 14px;
  animation: slideIn 0.3s;
  display: flex;
  align-items: center;
  gap: 10px;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ===== LOGIN PARA USUARIOS ===== */
.menu-simple {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 200;
    background: var(--card);
    padding: 8px 15px;
    border-radius: 30px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
}

.login-container-simple {
    max-width: 450px;
    margin: 50px auto;
    padding: 30px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
}

.login-container-simple h2 {
    text-align: center;
    color: var(--primary);
    margin-bottom: 30px;
}

.login-container-simple h3 {
    margin: 20px 0 10px;
    font-size: 1.1em;
}

.user-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    margin: 15px 0;
    max-height: 300px;
    overflow-y: auto;
    padding: 5px;
}

.user-button {
    padding: 10px;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9em;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 5px;
}

.user-button.electrico {
    background: #1e88e5;
}

.user-button.mecanico {
    background: #f59e0b;
}

.user-button.admin {
    background: #8b5cf6;
}

.add-user-section {
    border-top: 1px solid rgba(0,0,0,0.1);
    padding-top: 20px;
    margin-top: 20px;
}

.add-user-input {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.add-user-input input {
    flex: 2;
    min-width: 150px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: var(--card);
    color: var(--text);
}

.add-user-input select {
    flex: 1;
    min-width: 120px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: var(--card);
    color: var(--text);
}

.add-user-input button {
    padding: 10px 20px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>
<body>
<button id="night">🌙</button>
<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>
<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>
<div class="container">
<div class="carousel" id="carousel"></div>
</div>
<div id="calendar">
<div style="display:flex;justify-content:space-between;align-items:center">
<button onclick="changeMonth(-1)">◀</button>
<h3 id="calendarTitle"></h3>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<div id="history">
<h3>📜 Historial real</h3>
<div id="historyList"></div>
</div>

<script>
// ========== CONFIGURACIÓN GIST ==========
const GIST_CONFIG = {
    usuario: 'alsisanty-lgtm',
    id: '0540f0550bdf2456f2a25ae965fa7725',
    archivo: 'guardias-alsi-data.json'
};

// ========== VARIABLES GLOBALES ==========
let offset = 0;
let calendarMonth = new Date();
let ultimaVersion = localStorage.getItem('version') || '0';

// ========== DATOS DE PERSONAL ==========
let electricos = JSON.parse(localStorage.getItem('electricos') || '["Jose", "Dani", "Abde", "Fran", "Fran Ruiz", "Hicham"]');
let mecanicos = JSON.parse(localStorage.getItem('mecanicos') || '["Fran Alba", "Manu", "Cele", "Santy", "Ramon", "Traian"]');

// ========== CARGAR DATOS GUARDADOS ==========
let ordenElectricos = JSON.parse(localStorage.getItem('ordenElectricos') || 'null') || [...electricos];
let ordenMecanicos = JSON.parse(localStorage.getItem('ordenMecanicos') || 'null') || [...mecanicos];
let estados = JSON.parse(localStorage.getItem('estados') || '{}');
let manualOverrides = JSON.parse(localStorage.getItem('manualOverrides') || '{}');
let history = JSON.parse(localStorage.getItem('history') || '[]');

// ========== USUARIOS ==========
let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

// ========== FUNCIONES DE USUARIOS ==========
function loginSimple(nombre) {
    const user = usuarios.find(u => u.nombre === nombre);
    if (user) {
        currentUser = user;
        localStorage.setItem('currentUser', JSON.stringify(user));
        mostrarNotificacion(`👋 Bienvenido ${nombre}`, 'success');
        location.reload();
        return true;
    }
    mostrarNotificacion('❌ Usuario no existe', 'error');
    return false;
}

function logoutSimple() {
    currentUser = null;
    localStorage.removeItem('currentUser');
    mostrarNotificacion('👋 Hasta luego', 'info');
    location.reload();
}

function agregarUsuarioSimple(nombre, departamento) {
    if (!nombre || !nombre.trim()) {
        mostrarNotificacion('❌ Escribe un nombre', 'error');
        return false;
    }
    
    if (!departamento) {
        mostrarNotificacion('❌ Selecciona un departamento', 'error');
        return false;
    }
    
    nombre = nombre.trim();
    
    if (usuarios.some(u => u.nombre === nombre)) {
        mostrarNotificacion('❌ El usuario ya existe', 'error');
        return false;
    }
    
    // AÑADIR A LA LISTA DE PERSONAL
    if (departamento === 'electrico') {
        if (!electricos.includes(nombre)) {
            electricos.push(nombre);
            ordenElectricos.push(nombre);
            localStorage.setItem('electricos', JSON.stringify(electricos));
            localStorage.setItem('ordenElectricos', JSON.stringify(ordenElectricos));
        }
    } else if (departamento === 'mecanico') {
        if (!mecanicos.includes(nombre)) {
            mecanicos.push(nombre);
            ordenMecanicos.push(nombre);
            localStorage.setItem('mecanicos', JSON.stringify(mecanicos));
            localStorage.setItem('ordenMecanicos', JSON.stringify(ordenMecanicos));
        }
    }
    
    usuarios.push({
        nombre: nombre,
        departamento: departamento
    });
    
    localStorage.setItem('usuarios', JSON.stringify(usuarios));
    mostrarNotificacion(`✅ Usuario ${nombre} (${departamento}) añadido`, 'success');
    renderLoginSimple();
    return true;
}

// ========== PANTALLA LOGIN ==========
function renderLoginSimple() {
    document.querySelector('header').style.display = 'none';
    document.querySelector('.nav').style.display = 'none';
    document.querySelector('.container').style.display = 'none';
    document.getElementById('calendar').style.display = 'none';
    document.getElementById('history').style.display = 'none';
    document.getElementById('night').style.display = 'none';
    
    const oldLogin = document.querySelector('.login-container-simple');
    if (oldLogin) oldLogin.remove();
    
    const admins = usuarios.filter(u => u.departamento === 'admin');
    const electricosUsers = usuarios.filter(u => u.departamento === 'electrico');
    const mecanicosUsers = usuarios.filter(u => u.departamento === 'mecanico');
    
    const loginDiv = document.createElement('div');
    loginDiv.className = 'login-container-simple';
    
    let html = `<h2>🔐 Guardias Alsi</h2>`;
    
    if (admins.length > 0) {
        html += `<h3>👑 Administradores</h3>`;
        html += `<div class="user-buttons">`;
        admins.forEach(u => {
            html += `<button onclick="loginSimple('${u.nombre}')" class="user-button admin">👑 ${u.nombre}</button>`;
        });
        html += `</div>`;
    }
    
    if (electricosUsers.length > 0) {
        html += `<h3>⚡ Eléctricos</h3>`;
        html += `<div class="user-buttons">`;
        electricosUsers.forEach(u => {
            html += `<button onclick="loginSimple('${u.nombre}')" class="user-button electrico">⚡ ${u.nombre}</button>`;
        });
        html += `</div>`;
    }
    
    if (mecanicosUsers.length > 0) {
        html += `<h3>🔧 Mecánicos</h3>`;
        html += `<div class="user-buttons">`;
        mecanicosUsers.forEach(u => {
            html += `<button onclick="loginSimple('${u.nombre}')" class="user-button mecanico">🔧 ${u.nombre}</button>`;
        });
        html += `</div>`;
    }
    
    html += `
        <div class="add-user-section">
            <h3>📝 Registrarse</h3>
            <div class="add-user-input">
                <input type="text" id="nuevo-usuario" placeholder="Tu nombre" onkeypress="if(event.key==='Enter') agregarUsuarioSimple(this.value, document.getElementById('nuevo-departamento').value)">
                <select id="nuevo-departamento">
                    <option value="">Selecciona...</option>
                    <option value="electrico">⚡ Eléctrico</option>
                    <option value="mecanico">🔧 Mecánico</option>
                </select>
                <button onclick="agregarUsuarioSimple(document.getElementById('nuevo-usuario').value, document.getElementById('nuevo-departamento').value)">Registrarse</button>
            </div>
        </div>
    `;
    
    loginDiv.innerHTML = html;
    document.body.insertAdjacentElement('afterbegin', loginDiv);
}

// ========== MENÚ USUARIO ==========
function renderMenuSimple() {
    if (!currentUser) return;
    
    const oldMenu = document.querySelector('.menu-simple');
    if (oldMenu) oldMenu.remove();
    
    let icono = '👤';
    let color = '';
    
    if (currentUser.departamento === 'admin') {
        icono = '👑';
        color = '#8b5cf6';
    } else if (currentUser.departamento === 'electrico') {
        icono = '⚡';
        color = '#1e88e5';
    } else if (currentUser.departamento === 'mecanico') {
        icono = '🔧';
        color = '#f59e0b';
    }
    
    const menuDiv = document.createElement('div');
    menuDiv.className = 'menu-simple';
    menuDiv.innerHTML = `
        <span style="font-weight:bold; color:${color};">${icono} ${currentUser.nombre}</span>
        <span style="background:rgba(0,0,0,0.05); padding:2px 8px; border-radius:12px; font-size:0.8em;">
            ${currentUser.departamento === 'admin' ? 'Admin' : (currentUser.departamento === 'electrico' ? 'Electricidad' : 'Mecánica')}
        </span>
        <button onclick="logoutSimple()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:1.2em;padding:0 5px;" title="Cerrar sesión">🚪</button>
    `;
    
    document.body.insertAdjacentElement('afterbegin', menuDiv);
}

// ========== FUNCIONES DE FECHA ==========
const FECHA_BASE = new Date(2024, 0, 1);
const MS_POR_SEMANA = 7 * 24 * 60 * 60 * 1000;

function obtenerLunes(fecha) {
    const d = new Date(fecha);
    const dia = d.getDay();
    const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
}

function calcularNumeroSemana(fecha) {
    const fechaLunes = obtenerLunes(fecha);
    fechaLunes.setHours(12, 0, 0, 0);
    const fechaBaseLunes = obtenerLunes(FECHA_BASE);
    fechaBaseLunes.setHours(12, 0, 0, 0);
    const diferenciaMs = fechaLunes - fechaBaseLunes;
    return Math.floor(diferenciaMs / MS_POR_SEMANA);
}

const fd = d => {
    const date = new Date(d);
    return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
};

// ========== FUNCIONES DE ROTACIÓN ==========
const activos = l => {
    const lista = l === electricos ? ordenElectricos : ordenMecanicos;
    return lista.filter(p => !estados[p] || estados[p] === "activo");
};

const guardia = (l, numeroSemana) => {
    const a = activos(l);
    if (a.length === 0) return "Nadie";
    
    const semanaKey = numeroSemana.toString();
    if (manualOverrides[semanaKey]) {
        const tipo = l === electricos ? 'electrico' : 'mecanico';
        if (manualOverrides[semanaKey][tipo]) {
            return manualOverrides[semanaKey][tipo];
        }
    }
    
    const indice = ((numeroSemana % a.length) + a.length) % a.length;
    return a[indice];
};

function getEstadoTexto(estado) {
    switch(estado) {
        case 'activo': return 'Activo';
        case 'vacaciones': return 'Vacaciones';
        case 'viaje': return 'Viaje';
        case 'baja': return 'Baja';
        case 'inactivo': return 'Inactivo';
        default: return 'Activo';
    }
}

// ========== FUNCIONES DE NOTIFICACIÓN ==========
function mostrarNotificacion(mensaje, tipo = 'success') {
    const notif = document.createElement('div');
    notif.className = 'notificacion-github';
    
    let color, icono;
    if (tipo === 'success') { color = '#4CAF50'; icono = '✅'; }
    else if (tipo === 'error') { color = '#f44336'; icono = '❌'; }
    else { color = '#2196F3'; icono = '🔄'; }
    
    notif.style.background = color;
    notif.innerHTML = `
        <span>${icono}</span>
        <span>${mensaje}</span>
        <button onclick="this.parentElement.remove()" style="background:none;border:none;color:white;font-size:18px;cursor:pointer;margin-left:10px;">×</button>
    `;
    
    document.body.appendChild(notif);
    setTimeout(() => {
        if (notif.parentNode) {
            notif.style.opacity = '0';
            notif.style.transition = 'opacity 0.5s';
            setTimeout(() => notif.remove(), 500);
        }
    }, 5000);
}

// ========== CALENDARIO ==========
function renderCalendar() {
    const calendarGrid = document.getElementById('calendarGrid');
    if (!calendarGrid) return;
    
    calendarGrid.innerHTML = "";
    const y = calendarMonth.getFullYear();
    const m = calendarMonth.getMonth();
    
    document.getElementById('calendarTitle').textContent = `📆 ${calendarMonth.toLocaleString("es", { month: "long" })}, ${y}`;
    
    const primerDia = new Date(y, m, 1);
    const ultimoDia = new Date(y, m + 1, 0);
    
    const inicio = new Date(primerDia);
    const diaSemana = inicio.getDay();
    inicio.setDate(inicio.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1));
    
    const fin = new Date(ultimoDia);
    const diaSemanaFin = fin.getDay();
    fin.setDate(fin.getDate() + (diaSemanaFin === 0 ? 0 : 7 - diaSemanaFin));
    
    let fechaActual = new Date(inicio);
    while (fechaActual <= fin) {
        const esFueraMes = fechaActual.getMonth() !== m;
        const diaSemana = fechaActual.getDay();
        const esDiaLaboral = diaSemana >= 1 && diaSemana <= 5;
        const numeroSemana = calcularNumeroSemana(fechaActual);
        const elecGuardia = guardia(electricos, numeroSemana);
        const mecGuardia = guardia(mecanicos, numeroSemana);
        const tieneOverride = manualOverrides[numeroSemana.toString()];
        
        let contenidoHTML = `<div class="day-number">${fechaActual.getDate()}</div>`;
        if (esDiaLaboral && !esFueraMes) {
            contenidoHTML += `
                <div class="guardia-info">
                    <div class="${tieneOverride ? 'status-viaje' : 'status-active'}">⚡ ${elecGuardia}</div>
                    <div class="${tieneOverride ? 'status-viaje' : 'status-active'}">🔧 ${mecGuardia}</div>
                </div>
            `;
        }
        
        const clases = ['calendar-day'];
        if (esFueraMes) clases.push('outside');
        if (esDiaLaboral) clases.push('weekday');
        else clases.push('weekend');
        
        calendarGrid.innerHTML += `<div class="${clases.join(' ')}">${contenidoHTML}</div>`;
        fechaActual.setDate(fechaActual.getDate() + 1);
    }
}

function changeMonth(delta) {
    calendarMonth.setMonth(calendarMonth.getMonth() + delta);
    renderCalendar();
}

// ========== RENDER ==========
function render() {
    const carousel = document.getElementById('carousel');
    if (!carousel) return;
    
    carousel.innerHTML = "";
    const hoy = new Date();
    const numeroSemanaActual = calcularNumeroSemana(hoy);
    
    const fechaBase = obtenerLunes(hoy);
    fechaBase.setDate(fechaBase.getDate() + (offset * 7));
    
    const fechaInicio = new Date(fechaBase);
    const fechaFin = new Date(fechaInicio);
    fechaFin.setDate(fechaFin.getDate() + 4);
    
    document.getElementById('subtitle').textContent = `${fd(fechaInicio)} - ${fd(fechaFin)}`;
    
    for (let i = -1; i <= 1; i++) {
        const semanaOffset = offset + i;
        const numeroSemana = numeroSemanaActual + semanaOffset;
        
        const semanaInicio = new Date(fechaBase);
        semanaInicio.setDate(semanaInicio.getDate() + (i * 7));
        const semanaFin = new Date(semanaInicio);
        semanaFin.setDate(semanaFin.getDate() + 4);
        
        const elecGuardia = guardia(electricos, numeroSemana);
        const mecGuardia = guardia(mecanicos, numeroSemana);
        const tieneOverride = manualOverrides[numeroSemana.toString()];
        
        carousel.innerHTML += `
            <div class="card">
                <h3>${fd(semanaInicio)} - ${fd(semanaFin)} ${tieneOverride ? '🔄' : ''}</h3>
                <div class="guardias">
                    <div class="guardia">
                        <div class="icono">⚡</div>
                        <div class="nombre">${elecGuardia}</div>
                        <div class="days">L–V</div>
                        <div class="time">15:30 – 19:00</div>
                        <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">${getEstadoTexto(estados[elecGuardia])}</small>
                    </div>
                    <div class="guardia">
                        <div class="icono">🔧</div>
                        <div class="nombre">${mecGuardia}</div>
                        <div class="days">L–V</div>
                        <div class="time">15:30 – 19:00</div>
                        <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">${getEstadoTexto(estados[mecGuardia])}</small>
                    </div>
                </div>
            </div>
        `;
    }
    
    renderHistory();
}

// ========== HISTORIAL ==========
function logCompletedWeek() {
    const hoy = new Date();
    const viernes = obtenerLunes(hoy);
    viernes.setDate(viernes.getDate() + 4);
    
    if (hoy < viernes) return;
    
    const numeroSemana = calcularNumeroSemana(hoy);
    const clave = fd(obtenerLunes(hoy));
    
    if (history.some(h => h.startsWith(clave))) return;
    
    const elecGuardia = guardia(electricos, numeroSemana);
    const mecGuardia = guardia(mecanicos, numeroSemana);
    
    history.unshift(`${clave} ⚡ ${elecGuardia} · 🔧 ${mecGuardia}`);
    history = history.slice(0, 30);
    localStorage.setItem('history', JSON.stringify(history));
}

function renderHistory() {
    const historyList = document.getElementById('historyList');
    if (!historyList) return;
    
    historyList.innerHTML = "";
    history.forEach(h => {
        historyList.innerHTML += `<div class="history-item">${h}</div>`;
    });
}

// ========== LEER DE GIST ==========
async function leerDeGist() {
    try {
        const url = `https://gist.githubusercontent.com/${GIST_CONFIG.usuario}/${GIST_CONFIG.id}/raw/${GIST_CONFIG.archivo}?t=${Date.now()}`;
        const response = await fetch(url);
        if (!response.ok) return null;
        return await response.json();
    } catch (error) {
        console.log('Error leyendo Gist:', error);
        return null;
    }
}

// ========== MODO OSCURO ==========
document.getElementById('night').onclick = () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('dark', document.body.classList.contains('dark'));
};
if (localStorage.getItem('dark') === 'true') document.body.classList.add('dark');

// ========== EVENT LISTENERS ==========
document.getElementById('prev').onclick = () => { offset--; render(); };
document.getElementById('next').onclick = () => { offset++; render(); };

// ========== INICIALIZACIÓN ==========
document.addEventListener('DOMContentLoaded', async function() {
    // Verificar si hay usuario logueado
    if (!currentUser) {
        renderLoginSimple();
        return;
    }
    
    // Mostrar menú de usuario
    renderMenuSimple();
    
    // Mostrar contenido
    document.querySelector('header').style.display = 'block';
    document.querySelector('.nav').style.display = 'flex';
    document.querySelector('.container').style.display = 'block';
    document.getElementById('calendar').style.display = 'block';
    document.getElementById('history').style.display = 'block';
    document.getElementById('night').style.display = 'block';
    
    // Cargar datos desde Gist
    const config = await leerDeGist();
    if (config && config.version !== ultimaVersion) {
        console.log('📥 Cargando última versión desde Gist');
        if (config.ordenElectricos) {
            ordenElectricos = config.ordenElectricos;
            localStorage.setItem('ordenElectricos', JSON.stringify(ordenElectricos));
        }
        if (config.ordenMecanicos) {
            ordenMecanicos = config.ordenMecanicos;
            localStorage.setItem('ordenMecanicos', JSON.stringify(ordenMecanicos));
        }
        if (config.estados) {
            estados = config.estados;
            localStorage.setItem('estados', JSON.stringify(estados));
        }
        if (config.manualOverrides) {
            manualOverrides = config.manualOverrides;
            localStorage.setItem('manualOverrides', JSON.stringify(manualOverrides));
        }
        localStorage.setItem('version', config.version);
        ultimaVersion = config.version;
    }
    
    // Renderizar todo
    renderCalendar();
    render();
    logCompletedWeek();
    
    console.log('🚀 Versión usuarios');
});
</script>
