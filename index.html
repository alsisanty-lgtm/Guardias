<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardias Alsi</title>
    <style>
        /* RESET Y VARIABLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1e88e5;
            --bg: #f2f4f8;
            --card: #fff;
            --text: #1f2937;
            --muted: #6b7280;
            --shadow: 0 10px 25px rgba(0,0,0,.12);
            --radius: 18px;
        }
        
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e5e7eb;
            --muted: #9ca3af;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary), #1565c0);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        /* BOTÓN TEMA OSCURO */
        #themeToggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* BOTONES NAVEGACIÓN */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            gap: 10px;
        }
        
        .nav-button {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .nav-button:hover {
            opacity: 0.9;
        }
        
        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 100%;
            padding: 0 10px;
        }
        
        /* CARRUSEL - ESTILOS SIMPLIFICADOS */
        .carousel-wrapper {
            width: 100%;
            overflow: hidden;
            position: relative;
            touch-action: pan-y;
        }
        
        .carousel {
            display: flex;
            transition: transform 0.3s ease;
            width: 300%; /* 3 slides */
        }
        
        .carousel-slide {
            flex: 0 0 33.333%;
            width: 33.333%;
            padding: 10px;
        }
        
        /* TARJETA */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            width: 100%;
        }
        
        /* GUARDIAS */
        .guardias-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        
        .guardia {
            text-align: center;
            background: rgba(0,0,0,0.05);
            border-radius: 14px;
            padding: 20px;
        }
        
        body.dark .guardia {
            background: rgba(255,255,255,0.06);
        }
        
        .icono {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .nombre {
            font-size: 1.2em;
            font-weight: 800;
            margin: 5px 0;
        }
        
        .detalles {
            font-size: 0.9em;
            color: var(--muted);
            margin: 5px 0;
        }
        
        /* INDICADORES */
        .indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
            padding: 0 10px;
        }
        
        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            opacity: 0.5;
            transition: all 0.3s;
        }
        
        .indicator.active {
            opacity: 1;
            background: var(--primary);
            transform: scale(1.3);
        }
        
        /* HINT */
        .hint {
            text-align: center;
            color: var(--muted);
            font-size: 0.9em;
            margin: 10px 0 30px;
            padding: 10px;
        }
        
        /* SECCIONES */
        .section {
            background: var(--card);
            border-radius: var(--radius);
            margin: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        
        .section h3 {
            margin-bottom: 15px;
            color: var(--primary);
        }
        
        /* CALENDARIO */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        
        .calendar-day {
            font-size: 0.8em;
            text-align: center;
            padding: 8px 4px;
            border-radius: 8px;
            background: rgba(0,0,0,0.04);
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        
        .day-number {
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .weekday {
            background: rgba(30,136,229,0.08);
        }
        
        .weekend {
            background: rgba(0,0,0,0.02);
            color: var(--muted);
        }
        
        body.dark .weekday {
            background: rgba(30,136,229,0.18);
        }
        
        body.dark .weekend {
            background: rgba(255,255,255,0.03);
        }
        
        .guardia-info {
            font-size: 0.7em;
            line-height: 1.2;
            margin-top: 2px;
        }
        
        /* PERSONAS */
        .personas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .persona {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.03);
        }
        
        /* HISTORIAL */
        .history-item {
            padding: 8px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }
        
        /* RESPONSIVE */
        @media (min-width: 768px) {
            .guardias-container {
                flex-direction: row;
            }
            
            .guardia {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <button id="themeToggle">🌙</button>
    
    <header>
        <h1>Guardias Alsi</h1>
        <div id="subtitle">Cargando...</div>
    </header>
    
    <div class="nav-buttons">
        <button class="nav-button" id="prevBtn">⬅ Anterior</button>
        <button class="nav-button" id="nextBtn">Siguiente ➡</button>
    </div>
    
    <div class="container">
        <!-- CARRUSEL -->
        <div class="carousel-wrapper">
            <div class="carousel" id="carousel">
                <!-- Slides se generan dinámicamente -->
            </div>
        </div>
        
        <div class="indicators" id="indicators">
            <!-- Indicadores se generan dinámicamente -->
        </div>
        
        <div class="hint">← Desliza con el dedo para cambiar de semana →</div>
        
        <!-- CALENDARIO -->
        <div class="section" id="calendarSection">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button class="nav-button" onclick="changeMonth(-1)" style="padding: 8px 12px; flex: 0 0 auto;">◀</button>
                <h3 id="monthTitle">Enero 2024</h3>
                <button class="nav-button" onclick="changeMonth(1)" style="padding: 8px 12px; flex: 0 0 auto;">▶</button>
            </div>
            <div class="calendar-grid" id="calendar">
                <!-- Días del calendario se generan dinámicamente -->
            </div>
        </div>
        
        <!-- PERSONAS -->
        <div class="section">
            <h3>👥 Personal Actual</h3>
            <div class="personas-grid" id="personas">
                <!-- Personas se generan dinámicamente -->
            </div>
        </div>
        
        <!-- HISTORIAL -->
        <div class="section">
            <h3>📜 Historial</h3>
            <div id="history">
                <!-- Historial se genera dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        // ========== DATOS INICIALES ==========
        let electricos = JSON.parse(localStorage.ordenElectricos || '["Fran Ruiz","Hicham","Jose","Abde","Dani","Fran"]');
        let mecanicos = JSON.parse(localStorage.ordenMecanicos || '["Ramon","Traian","Manu","Fran Alba","Cele","Santy"]');
        let estados = JSON.parse(localStorage.estados || "{}");
        let history = JSON.parse(localStorage.history || "[]");
        let manualOverrides = JSON.parse(localStorage.manualOverrides || "{}");
        
        // ========== VARIABLES DEL CARRUSEL ==========
        let currentWeek = 0; // Semana actual (0 = esta semana)
        let currentMonth = new Date(); // Mes actual para calendario
        let currentSlide = 1; // Slide actual (0: anterior, 1: actual, 2: siguiente)
        
        // ========== ELEMENTOS DOM ==========
        const carousel = document.getElementById('carousel');
        const indicators = document.getElementById('indicators');
        const subtitle = document.getElementById('subtitle');
        
        // ========== FUNCIONES DE FECHAS ==========
        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }
        
        function getWeekNumber(date) {
            const monday = getMonday(date);
            const baseMonday = getMonday(new Date(2024, 0, 1));
            const diff = monday - baseMonday;
            return Math.floor(diff / (7 * 24 * 60 * 60 * 1000));
        }
        
        function formatDate(date) {
            return date.toLocaleDateString('es-ES', {
                day: '2-digit',
                month: '2-digit'
            });
        }
        
        function formatFullDate(date) {
            return date.toLocaleDateString('es-ES', {
                weekday: 'short',
                day: '2-digit',
                month: '2-digit'
            });
        }
        
        // ========== FUNCIONES DE GUARDIAS ==========
        function getActivePeople(list) {
            return list.filter(person => !estados[person] || estados[person] === "activo");
        }
        
        function getGuardia(list, weekNumber) {
            const active = getActivePeople(list);
            if (active.length === 0) return "Nadie";
            
            const semanaKey = weekNumber.toString();
            if (manualOverrides[semanaKey]) {
                const tipo = list === electricos ? 'electrico' : 'mecanico';
                if (manualOverrides[semanaKey][tipo]) {
                    return manualOverrides[semanaKey][tipo];
                }
            }
            
            const index = ((weekNumber % active.length) + active.length) % active.length;
            return active[index];
        }
        
        function getEstadoTexto(estado) {
            const map = {
                'activo': 'Activo',
                'vacaciones': 'Vacaciones',
                'viaje': 'Viaje',
                'baja': 'Baja',
                'inactivo': 'Inactivo'
            };
            return map[estado] || 'Activo';
        }
        
        // ========== RENDERIZAR CARRUSEL ==========
        function renderCarousel() {
            const hoy = new Date();
            const semanaActual = getWeekNumber(hoy);
            
            // Calcular fechas para cada slide
            const slides = [
                { offset: -1, label: "Anterior" },
                { offset: 0, label: "Actual" },
                { offset: 1, label: "Siguiente" }
            ];
            
            let carouselHTML = '';
            let indicatorsHTML = '';
            
            slides.forEach((slide, index) => {
                const weekOffset = currentWeek + slide.offset;
                const weekNumber = semanaActual + weekOffset;
                
                // Calcular fechas de la semana
                const fechaBase = getMonday(hoy);
                fechaBase.setDate(fechaBase.getDate() + (weekOffset * 7));
                
                const inicio = new Date(fechaBase);
                const fin = new Date(inicio);
                fin.setDate(fin.getDate() + 4);
                
                // Obtener guardias
                const elecGuardia = getGuardia(electricos, weekNumber);
                const mecGuardia = getGuardia(mecanicos, weekNumber);
                const tieneOverride = manualOverrides[weekNumber.toString()];
                
                // Renderizar slide
                carouselHTML += `
                    <div class="carousel-slide">
                        <div class="card">
                            <h2 style="margin-bottom: 10px; color: var(--primary);">
                                ${formatDate(inicio)} - ${formatDate(fin)}
                                ${tieneOverride ? ' 🔄' : ''}
                            </h2>
                            <div class="guardias-container">
                                <div class="guardia">
                                    <div class="icono">⚡</div>
                                    <div class="nombre">${elecGuardia}</div>
                                    <div class="detalles">Lunes a Viernes</div>
                                    <div class="detalles" style="font-weight: bold;">15:30 – 19:00</div>
                                    <div class="detalles" style="color: ${tieneOverride ? '#8b5cf6' : '#10b981'}; font-size: 0.8em;">
                                        ${getEstadoTexto(estados[elecGuardia] || 'activo')}
                                    </div>
                                </div>
                                <div class="guardia">
                                    <div class="icono">🔧</div>
                                    <div class="nombre">${mecGuardia}</div>
                                    <div class="detalles">Lunes a Viernes</div>
                                    <div class="detalles" style="font-weight: bold;">15:30 – 19:00</div>
                                    <div class="detalles" style="color: ${tieneOverride ? '#8b5cf6' : '#10b981'}; font-size: 0.8em;">
                                        ${getEstadoTexto(estados[mecGuardia] || 'activo')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                // Renderizar indicador
                indicatorsHTML += `<div class="indicator ${index === 1 ? 'active' : ''}"></div>`;
            });
            
            // Actualizar DOM
            carousel.innerHTML = carouselHTML;
            indicators.innerHTML = indicatorsHTML;
            
            // Actualizar subtítulo (semana actual)
            const fechaBaseActual = getMonday(hoy);
            fechaBaseActual.setDate(fechaBaseActual.getDate() + (currentWeek * 7));
            const inicioActual = new Date(fechaBaseActual);
            const finActual = new Date(inicioActual);
            finActual.setDate(finActual.getDate() + 4);
            
            subtitle.textContent = `${formatDate(inicioActual)} - ${formatDate(finActual)}`;
            
            // Posicionar carrusel en slide central
            setTimeout(() => {
                carousel.style.transform = `translateX(-${currentSlide * 33.333}%)`;
            }, 50);
        }
        
        // ========== CARRUSEL TÁCTIL ==========
        function setupCarouselTouch() {
            let isDragging = false;
            let startPos = 0;
            let currentPos = 0;
            let velocity = 0;
            let lastPos = 0;
            let lastTime = 0;
            
            carousel.addEventListener('touchstart', handleStart);
            carousel.addEventListener('touchmove', handleMove);
            carousel.addEventListener('touchend', handleEnd);
            
            carousel.addEventListener('mousedown', handleStart);
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
            
            function handleStart(e) {
                isDragging = true;
                startPos = getPosition(e);
                lastPos = startPos;
                lastTime = Date.now();
                carousel.style.transition = 'none';
                e.preventDefault();
            }
            
            function handleMove(e) {
                if (!isDragging) return;
                
                currentPos = getPosition(e);
                const deltaPos = currentPos - lastPos;
                const deltaTime = Date.now() - lastTime;
                
                if (deltaTime > 0) {
                    velocity = deltaPos / deltaTime;
                }
                
                // Mover carrusel
                const offset = currentPos - startPos;
                const translateX = -currentSlide * 33.333 + (offset / window.innerWidth * 100);
                carousel.style.transform = `translateX(${translateX}%)`;
                
                lastPos = currentPos;
                lastTime = Date.now();
                e.preventDefault();
            }
            
            function handleEnd() {
                if (!isDragging) return;
                isDragging = false;
                
                const offset = currentPos - startPos;
                const threshold = window.innerWidth * 0.15; // 15% del ancho
                
                // Determinar si cambiar de slide
                if (Math.abs(offset) > threshold || Math.abs(velocity) > 0.3) {
                    if (offset > 0 || velocity > 0) {
                        // Deslizó a la derecha -> slide anterior
                        if (currentSlide > 0) {
                            currentWeek--;
                            currentSlide = 0;
                        }
                    } else {
                        // Deslizó a la izquierda -> slide siguiente
                        if (currentSlide < 2) {
                            currentWeek++;
                            currentSlide = 2;
                        }
                    }
                }
                
                // Volver a slide central
                currentSlide = 1;
                carousel.style.transition = 'transform 0.3s ease';
                carousel.style.transform = `translateX(-33.333%)`;
                
                // Si cambió la semana, re-renderizar
                if (Math.abs(offset) > threshold || Math.abs(velocity) > 0.3) {
                    setTimeout(() => {
                        renderCarousel();
                        renderCalendar();
                        renderPersonas();
                        renderHistory();
                    }, 300);
                }
            }
            
            function getPosition(e) {
                return e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            }
        }
        
        // ========== RENDERIZAR CALENDARIO ==========
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            
            // Actualizar título del mes
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                               'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            document.getElementById('monthTitle').textContent = `${monthNames[month]} ${year}`;
            
            // Calcular primer y último día del mes
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            // Calcular día de inicio (domingo de la semana que contiene el primer día)
            const startDate = new Date(firstDay);
            const startDay = startDate.getDay();
            const daysToSubtract = startDay === 0 ? 6 : startDay - 1;
            startDate.setDate(startDate.getDate() - daysToSubtract);
            
            // Calcular día final (sábado de la semana que contiene el último día)
            const endDate = new Date(lastDay);
            const endDay = endDate.getDay();
            const daysToAdd = endDay === 0 ? 0 : 7 - endDay;
            endDate.setDate(endDate.getDate() + daysToAdd);
            
            // Generar días
            let calendarHTML = '';
            let currentDate = new Date(startDate);
            
            while (currentDate <= endDate) {
                const dayMonth = currentDate.getMonth();
                const isCurrentMonth = dayMonth === month;
                const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;
                const isToday = currentDate.toDateString() === new Date().toDateString();
                
                // Calcular semana y guardias
                const weekNumber = getWeekNumber(currentDate);
                const elecGuardia = getGuardia(electricos, weekNumber);
                const mecGuardia = getGuardia(mecanicos, weekNumber);
                const tieneOverride = manualOverrides[weekNumber.toString()];
                const isWorkDay = currentDate.getDay() >= 1 && currentDate.getDay() <= 5;
                
                let dayHTML = `
                    <div class="day-number">${currentDate.getDate()}</div>
                `;
                
                if (isWorkDay && isCurrentMonth) {
                    dayHTML += `
                        <div class="guardia-info">
                            <div style="color: ${tieneOverride ? '#8b5cf6' : '#10b981'}">⚡ ${elecGuardia}</div>
                            <div style="color: ${tieneOverride ? '#8b5cf6' : '#10b981'}">🔧 ${mecGuardia}</div>
                        </div>
                    `;
                }
                
                const classes = [
                    'calendar-day',
                    isCurrentMonth ? '' : 'outside',
                    isWeekend ? 'weekend' : 'weekday'
                ].filter(c => c).join(' ');
                
                calendarHTML += `
                    <div class="${classes}">
                        ${dayHTML}
                    </div>
                `;
                
                currentDate.setDate(currentDate.getDate() + 1);
            }
            
            document.getElementById('calendar').innerHTML = calendarHTML;
        }
        
        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            renderCalendar();
        }
        
        // ========== RENDERIZAR PERSONAS ==========
        function renderPersonas() {
            let personasHTML = '';
            
            // Eléctricos
            electricos.forEach(persona => {
                const estado = estados[persona] || 'activo';
                if (estado !== 'inactivo') {
                    personasHTML += `
                        <div class="persona">
                            <span style="font-size: 1.2em;">⚡</span>
                            <span>${persona}</span>
                            <span style="margin-left: auto; font-size: 0.8em; color: ${
                                estado === 'activo' ? '#10b981' :
                                estado === 'vacaciones' ? '#f59e0b' :
                                estado === 'viaje' ? '#8b5cf6' :
                                estado === 'baja' ? '#ef4444' : '#6b7280'
                            }">
                                ${getEstadoTexto(estado)}
                            </span>
                        </div>
                    `;
                }
            });
            
            // Mecánicos
            mecanicos.forEach(persona => {
                const estado = estados[persona] || 'activo';
                if (estado !== 'inactivo') {
                    personasHTML += `
                        <div class="persona">
                            <span style="font-size: 1.2em;">🔧</span>
                            <span>${persona}</span>
                            <span style="margin-left: auto; font-size: 0.8em; color: ${
                                estado === 'activo' ? '#10b981' :
                                estado === 'vacaciones' ? '#f59e0b' :
                                estado === 'viaje' ? '#8b5cf6' :
                                estado === 'baja' ? '#ef4444' : '#6b7280'
                            }">
                                ${getEstadoTexto(estado)}
                            </span>
                        </div>
                    `;
                }
            });
            
            document.getElementById('personas').innerHTML = personasHTML;
        }
        
        // ========== RENDERIZAR HISTORIAL ==========
        function renderHistory() {
            let historyHTML = '';
            
            history.slice(0, 10).forEach(item => {
                historyHTML += `
                    <div class="history-item">
                        <span>${item}</span>
                    </div>
                `;
            });
            
            document.getElementById('history').innerHTML = historyHTML;
        }
        
        // ========== EVENT LISTENERS ==========
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentWeek--;
            renderCarousel();
            renderCalendar();
            renderPersonas();
            renderHistory();
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentWeek++;
            renderCarousel();
            renderCalendar();
            renderPersonas();
            renderHistory();
        });
        
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('darkMode', document.body.classList.contains('dark'));
        });
        
        // ========== INICIALIZACIÓN ==========
        function init() {
            // Cargar tema oscuro
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark');
            }
            
            // Renderizar todo
            renderCarousel();
            renderCalendar();
            renderPersonas();
            renderHistory();
            
            // Configurar carrusel táctil
            setTimeout(setupCarouselTouch, 100);
            
            console.log('Aplicación cargada correctamente');
        }
        
        // Iniciar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
