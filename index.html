<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi</title>
<style>
:root{
 --primary:#1e88e5;--bg:#f2f4f8;--card:#fff;
 --text:#1f2937;--muted:#6b7280;
 --shadow:0 10px 25px rgba(0,0,0,.12);
 --radius:18px;
}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af}
body{
 margin:0;
 font-family:system-ui;
 background:var(--bg);
 color:var(--text);
 -webkit-tap-highlight-color: transparent;
}
header{
 background:linear-gradient(135deg,#1e88e5,#1565c0);
 color:#fff;
 padding:20px;
 text-align:center;
}
button{
 background:var(--primary);
 color:#fff;
 border:none;
 padding:12px 18px;
 border-radius:14px;
 font-weight:700;
 cursor:pointer;
}
#night{position:fixed;top:12px;right:12px;z-index:200}
.nav{display:flex;justify-content:space-between;padding:10px}
.container{max-width:960px;margin:auto;padding:10px}

/* ===== TARJETA ÚNICA CON SWIPE ===== */
.card-container {
 position: relative;
 width: 100%;
 margin: 0 auto;
 perspective: 1000px;
}

.swipe-card {
 background:var(--card);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 padding:25px;
 margin:15px;
 position: relative;
 transition: transform 0.3s ease;
 touch-action: pan-y;
 user-select: none;
}

.swipe-card.swiping {
 transition: none;
}

.swipe-indicator {
 text-align: center;
 margin: 15px 0;
 color: var(--muted);
 font-size: 0.9em;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 10px;
}

.arrow {
 font-size: 1.5em;
 opacity: 0.7;
 transition: transform 0.3s;
}

.swipe-hint {
 text-align: center;
 color: var(--muted);
 font-size: 0.9em;
 margin: 10px 0;
 padding: 10px;
 background: rgba(30, 136, 229, 0.05);
 border-radius: 10px;
}

.guardias{
 display:flex;
 gap:14px;
 margin-top:14px;
}
.guardia{
 flex:1;
 text-align:center;
 background:rgba(0,0,0,.05);
 border-radius:14px;
 padding:14px;
}
body.dark .guardia{background:rgba(255,255,255,.06)}
.icono{font-size:2.2em}
.nombre{font-size:1.15em;font-weight:800}
.days{font-size:.85em;color:var(--muted)}
.time{font-weight:700;font-size:.9em}
.status-active{color:#10b981}
.status-vacaciones{color:#f59e0b}
.status-viaje{color:#8b5cf6}
.status-baja{color:#ef4444}
.status-inactivo{color:#6b7280}

/* ===== CALENDARIO ===== */
#calendar{
 margin:20px;background:var(--card);
 border-radius:var(--radius);padding:16px
}
.calendar-head{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 font-size:.7rem;
 font-weight:700;
 color:var(--muted);
 text-align:center;
 margin-top:8px
}
.calendar-grid{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:4px;
 margin-top:10px
}
.calendar-day{
 font-size:.7rem;text-align:center;
 padding:6px;border-radius:8px;
 background:rgba(0,0,0,.04);
 min-height:70px;
 display:flex;
 flex-direction:column;
 justify-content:flex-start;
}
.day-number{
 font-weight:bold;
 margin-bottom:3px;
}
.weekday{background:rgba(30,136,229,.08);cursor:pointer}
.weekend{background:rgba(0,0,0,.02);color:var(--muted)}
.today-week{outline:2px solid var(--primary)}
body.dark .weekday{background:rgba(30,136,229,.18)}
body.dark .weekend{background:rgba(255,255,255,.03)}
.calendar-day.outside{
 background:rgba(0,0,0,.02);color:var(--muted)
}
.guardia-info{
 font-size:9px;
 line-height:1.2;
 margin-top:2px;
}

/* ===== INFO ===== */
.info-section{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius);
}
.info-section h3{margin-top:0}
.personas-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
 gap:10px;
 margin-top:10px;
}
.persona-item{
 padding:8px 12px;
 border-radius:8px;
 background:rgba(0,0,0,.03);
 display:flex;
 align-items:center;
 gap:8px;
}
.persona-item .icon{font-size:1.2em}

/* ===== HISTORIAL ===== */
#history{
 margin:20px;background:var(--card);
 padding:16px;border-radius:var(--radius)
}
.history-item{
 font-size:.9em;border-bottom:1px dashed rgba(0,0,0,.2);
 padding:6px 0;
 display:flex;
 justify-content:space-between;
}
</style>
</head>
<body>
<button id="night">🌙</button>
<header>
<h1>Guardias Alsi</h1>
<div id="subtitle"></div>
</header>
<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>
<div class="container">
<div class="card-container">
 <div class="swipe-indicator">
  <span class="arrow">◀</span>
  <span>Semana actual</span>
  <span class="arrow">▶</span>
 </div>
 <div class="swipe-card" id="swipeCard">
  <!-- Aquí se renderiza la semana actual -->
 </div>
 <div class="swipe-hint">← Desliza en la tarjeta para cambiar de semana →</div>
</div>
</div>

<div id="calendar">
<div style="display:flex;justify-content:space-between;align-items:center">
<button onclick="changeMonth(-1)">◀</button>
<h3 id="calendarTitle"></h3>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="info-section">
<h3>👥 Personal Actual</h3>
<div class="personas-grid" id="personasList"></div>
</div>

<div id="history">
<h3>📜 Historial de Guardias</h3>
<div id="historyList"></div>
</div>

<script>
// ========== VARIABLES GLOBALES ==========
let electricos = JSON.parse(localStorage.ordenElectricos || '["Fran Ruiz","Hicham","Jose","Abde","Dani","Fran"]');
let mecanicos = JSON.parse(localStorage.ordenMecanicos || '["Ramon","Traian","Manu","Fran Alba","Cele","Santy"]');
let estados = JSON.parse(localStorage.estados || "{}");
let history = JSON.parse(localStorage.history || "[]");
let manualOverrides = JSON.parse(localStorage.manualOverrides || "{}");
let offset = 0;
let calendarMonth = new Date();

// Variables para el swipe
let startX = 0;
let startY = 0;
let isSwiping = false;
let swipeCard = document.getElementById('swipeCard');

// ========== FUNCIONES BÁSICAS ==========
const FECHA_BASE = new Date(2024, 0, 1);
const MS_POR_SEMANA = 7 * 24 * 60 * 60 * 1000;

function obtenerLunes(fecha) {
 const d = new Date(fecha);
 const dia = d.getDay();
 const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
 return new Date(d.setDate(diff));
}

function calcularNumeroSemana(fecha) {
 const fechaLunes = obtenerLunes(fecha);
 const fechaBaseLunes = obtenerLunes(FECHA_BASE);
 const diferenciaMs = fechaLunes - fechaBaseLunes;
 return Math.floor(diferenciaMs / MS_POR_SEMANA);
}

const fd = d => {
 const date = new Date(d);
 return date.toLocaleDateString('es-ES', {
  day: '2-digit',
  month: '2-digit'
 });
};

const activos = l => l.filter(p => !estados[p] || estados[p] === "activo");

const guardia = (l, numeroSemana) => {
 const a = activos(l);
 if (a.length === 0) return "Nadie";
 
 const semanaKey = numeroSemana.toString();
 if (manualOverrides[semanaKey]) {
  const tipo = l === electricos ? 'electrico' : 'mecanico';
  if (manualOverrides[semanaKey][tipo]) {
   return manualOverrides[semanaKey][tipo];
  }
 }
 
 const indice = ((numeroSemana % a.length) + a.length) % a.length;
 return a[indice];
};

// ========== RENDERIZAR SEMANA ACTUAL ==========
function render() {
 const hoy = new Date();
 const numeroSemanaActual = calcularNumeroSemana(hoy);
 
 const fechaBase = obtenerLunes(hoy);
 fechaBase.setDate(fechaBase.getDate() + (offset * 7));
 
 const fechaInicio = new Date(fechaBase);
 const fechaFin = new Date(fechaInicio);
 fechaFin.setDate(fechaFin.getDate() + 4);
 
 document.getElementById('subtitle').textContent = `${fd(fechaInicio)} - ${fd(fechaFin)}`;
 
 const numeroSemana = numeroSemanaActual + offset;
 const elecGuardia = guardia(electricos, numeroSemana);
 const mecGuardia = guardia(mecanicos, numeroSemana);
 const tieneOverride = manualOverrides[numeroSemana.toString()];
 
 swipeCard.innerHTML = `
  <h3>${fd(fechaInicio)} - ${fd(fechaFin)} ${tieneOverride ? '🔄' : ''}</h3>
  <div class="guardias">
   <div class="guardia">
    <div class="icono">⚡</div>
    <div class="nombre">${elecGuardia}</div>
    <div class="days">L–V</div>
    <div class="time">15:30 – 19:00</div>
    <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">
     ${estados[elecGuardia] ? getEstadoTexto(estados[elecGuardia]) : 'Activo'}
    </small>
   </div>
   <div class="guardia">
    <div class="icono">🔧</div>
    <div class="nombre">${mecGuardia}</div>
    <div class="days">L–V</div>
    <div class="time">15:30 – 19:00</div>
    <small class="${tieneOverride ? 'status-viaje' : 'status-active'}">
     ${estados[mecGuardia] ? getEstadoTexto(estados[mecGuardia]) : 'Activo'}
    </small>
   </div>
  </div>
 `;
 
 renderHistory();
}

function getEstadoTexto(estado) {
 switch(estado){
  case 'activo': return 'Activo';
  case 'vacaciones': return 'Vacaciones';
  case 'viaje': return 'Viaje';
  case 'baja': return 'Baja';
  case 'inactivo': return 'Inactivo';
  default: return 'Activo';
 }
}

// ========== SWIPE DETECTION - ESTA SÍ FUNCIONA ==========
function setupSwipe() {
 swipeCard = document.getElementById('swipeCard');
 
 // Touch events
 swipeCard.addEventListener('touchstart', function(e) {
  isSwiping = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  swipeCard.classList.add('swiping');
  e.preventDefault();
 });
 
 swipeCard.addEventListener('touchmove', function(e) {
  if (!isSwiping) return;
  
  const currentX = e.touches[0].clientX;
  const currentY = e.touches[0].clientY;
  const diffX = currentX - startX;
  const diffY = currentY - startY;
  
  // Solo procesar si es un movimiento horizontal (no vertical)
  if (Math.abs(diffX) > Math.abs(diffY)) {
   e.preventDefault();
   
   // Mover la tarjeta mientras se desliza
   const movePercent = (diffX / window.innerWidth) * 100;
   swipeCard.style.transform = `translateX(${movePercent}px)`;
  }
 });
 
 swipeCard.addEventListener('touchend', function(e) {
  if (!isSwiping) return;
  
  const endX = e.changedTouches[0].clientX;
  const diffX = endX - startX;
  
  // Umbral mínimo para considerar un swipe
  const threshold = 50;
  
  if (Math.abs(diffX) > threshold) {
   if (diffX > 0) {
    // Swipe a la derecha -> semana anterior
    offset--;
    swipeCard.style.transform = 'translateX(100%)';
   } else {
    // Swipe a la izquierda -> semana siguiente
    offset++;
    swipeCard.style.transform = 'translateX(-100%)';
   }
   
   // Animación y cambio
   setTimeout(() => {
    render();
    swipeCard.style.transform = 'translateX(0)';
   }, 300);
  } else {
   // Vuelve a su posición
   swipeCard.style.transform = 'translateX(0)';
  }
  
  swipeCard.classList.remove('swiping');
  isSwiping = false;
 });
 
 // Mouse events para desarrollo
 swipeCard.addEventListener('mousedown', function(e) {
  isSwiping = true;
  startX = e.clientX;
  startY = e.clientY;
  swipeCard.classList.add('swiping');
 });
 
 document.addEventListener('mousemove', function(e) {
  if (!isSwiping) return;
  
  const currentX = e.clientX;
  const currentY = e.clientY;
  const diffX = currentX - startX;
  const diffY = currentY - startY;
  
  if (Math.abs(diffX) > Math.abs(diffY)) {
   const movePercent = (diffX / window.innerWidth) * 100;
   swipeCard.style.transform = `translateX(${movePercent}px)`;
  }
 });
 
 document.addEventListener('mouseup', function(e) {
  if (!isSwiping) return;
  
  const endX = e.clientX;
  const diffX = endX - startX;
  const threshold = 50;
  
  if (Math.abs(diffX) > threshold) {
   if (diffX > 0) {
    offset--;
    swipeCard.style.transform = 'translateX(100%)';
   } else {
    offset++;
    swipeCard.style.transform = 'translateX(-100%)';
   }
   
   setTimeout(() => {
    render();
    swipeCard.style.transform = 'translateX(0)';
   }, 300);
  } else {
   swipeCard.style.transform = 'translateX(0)';
  }
  
  swipeCard.classList.remove('swiping');
  isSwiping = false;
 });
}

// ========== CALENDARIO ==========
function renderCalendar() {
 document.getElementById('calendarGrid').innerHTML = "";
 const y = calendarMonth.getFullYear();
 const m = calendarMonth.getMonth();
 
 document.getElementById('calendarTitle').textContent = 
  `📆 ${calendarMonth.toLocaleString("es", { month: "long" })}, ${y}`;
 
 const primerDia = new Date(y, m, 1);
 const ultimoDia = new Date(y, m + 1, 0);
 
 const inicio = new Date(primerDia);
 const diaSemana = inicio.getDay();
 const diasAtras = diaSemana === 0 ? 6 : diaSemana - 1;
 inicio.setDate(inicio.getDate() - diasAtras);
 
 const fin = new Date(ultimoDia);
 const diaSemanaFin = fin.getDay();
 const diasAdelante = diaSemanaFin === 0 ? 0 : 7 - diaSemanaFin;
 fin.setDate(fin.getDate() + diasAdelante);
 
 let fechaActual = new Date(inicio);
 while (fechaActual <= fin) {
  const esMesAnterior = fechaActual.getMonth() < m;
  const esMesSiguiente = fechaActual.getMonth() > m;
  const esFueraMes = esMesAnterior || esMesSiguiente;
  const diaSemana = fechaActual.getDay();
  const esDiaLaboral = diaSemana >= 1 && diaSemana <= 5;
  
  const numeroSemana = calcularNumeroSemana(fechaActual);
  const elecGuardia = guardia(electricos, numeroSemana);
  const mecGuardia = guardia(mecanicos, numeroSemana);
  const tieneOverride = manualOverrides[numeroSemana.toString()];
  
  let contenidoHTML = `<div class="day-number">${fechaActual.getDate()}</div>`;
  
  if (esDiaLaboral && !esFueraMes) {
   contenidoHTML += `
    <div class="guardia-info">
     <div class="${tieneOverride?'status-viaje':'status-active'}">⚡ ${elecGuardia}</div>
     <div class="${tieneOverride?'status-viaje':'status-active'}">🔧 ${mecGuardia}</div>
    </div>
   `;
  }
  
  const clases = [
   'calendar-day',
   esFueraMes ? 'outside' : '',
   esDiaLaboral ? 'weekday' : 'weekend'
  ].filter(c => c).join(' ');
  
  document.getElementById('calendarGrid').innerHTML += `
   <div class="${clases}">
    ${contenidoHTML}
   </div>
  `;
  
  fechaActual.setDate(fechaActual.getDate() + 1);
 }
}

function changeMonth(delta) {
 calendarMonth.setMonth(calendarMonth.getMonth() + delta);
 renderCalendar();
}

// ========== PERSONAS ==========
function renderPersonasList() {
 let html = '';
 
 electricos.forEach(persona => {
  const estado = estados[persona] || 'activo';
  if (estado !== 'inactivo') {
   html += `
    <div class="persona-item">
     <span class="icon">⚡</span>
     <span>${persona}</span>
     <span class="status-${estado}" style="margin-left:auto;font-size:0.8em;">
      ${getEstadoTexto(estado)}
     </span>
    </div>`;
  }
 });
 
 mecanicos.forEach(persona => {
  const estado = estados[persona] || 'activo';
  if (estado !== 'inactivo') {
   html += `
    <div class="persona-item">
     <span class="icon">🔧</span>
     <span>${persona}</span>
     <span class="status-${estado}" style="margin-left:auto;font-size:0.8em;">
      ${getEstadoTexto(estado)}
     </span>
    </div>`;
  }
 });
 
 document.getElementById('personasList').innerHTML = html;
}

// ========== HISTORIAL ==========
function logCompletedWeek() {
 const hoy = new Date();
 const viernes = obtenerLunes(hoy);
 viernes.setDate(viernes.getDate() + 4);
 
 if (hoy < viernes) return;
 
 const numeroSemana = calcularNumeroSemana(hoy);
 const clave = fd(obtenerLunes(hoy));
 
 if (history.some(h => h.startsWith(clave))) return;
 
 const elecGuardia = guardia(electricos, numeroSemana);
 const mecGuardia = guardia(mecanicos, numeroSemana);
 
 history.unshift(`${clave} ⚡ ${elecGuardia} · 🔧 ${mecGuardia}`);
 history = history.slice(0, 30);
 localStorage.history = JSON.stringify(history);
}

function renderHistory() {
 const historyList = document.getElementById('historyList');
 historyList.innerHTML = "";
 
 history.forEach(h => {
  const [fecha, ...resto] = h.split(' ');
  const guardias = resto.join(' ');
  historyList.innerHTML += `
   <div class="history-item">
    <span>${fecha}</span>
    <span>${guardias}</span>
   </div>
  `;
 });
}

// ========== BOTONES DE NAVEGACIÓN ==========
document.getElementById('prev').addEventListener('click', () => {
 offset--;
 render();
});

document.getElementById('next').addEventListener('click', () => {
 offset++;
 render();
});

// ========== MODO OSCURO ==========
document.getElementById('night').addEventListener('click', () => {
 document.body.classList.toggle("dark");
 localStorage.dark = document.body.classList.contains("dark") ? "true" : "false";
});

if (localStorage.dark === "true") document.body.classList.add("dark");

// ========== INICIALIZACIÓN ==========
function init() {
 renderCalendar();
 renderPersonasList();
 logCompletedWeek();
 render();
 
 // Configurar detección de swipe
 setupSwipe();
}

// Iniciar
init();
</script>
</body>
</html>
