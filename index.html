<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi PRO</title>

<link rel="manifest" href="/Guardias/manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="/Guardias/icon-192.png">

<style>
:root{
  --primary:#1e88e5;
  --bg:#f4f6fa;
  --text:#222;
  --card:#fff;
  --shadow:0 8px 20px rgba(0,0,0,.15);
}
body.dark{--bg:#121212;--text:#eee;--card:#1e1e1e;}
body{margin:0;font-family:Segoe UI;background:var(--bg);color:var(--text);}
header{background:linear-gradient(135deg,#1e88e5,#1565c0);color:#fff;padding:20px;text-align:center;position:sticky;top:0;}
.container{max-width:900px;margin:auto;overflow:hidden;}
.carousel{display:flex;gap:10px;overflow-x:scroll;scroll-snap-type:x mandatory;}
.card{min-width:300px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px;scroll-snap-align:center;}
.guardias{display:flex;gap:15px;}
.guardia{flex:1;text-align:center;}
.icono{font-size:2.5em;}
.nombre{font-size:1.2em;font-weight:700;}
.nav{display:flex;justify-content:space-between;padding:10px;}
button{border:none;border-radius:12px;padding:10px 16px;background:var(--primary);color:#fff;font-weight:600;}
details{margin:20px;background:var(--card);padding:15px;border-radius:15px;}
.admin-person{display:flex;justify-content:space-between;align-items:center;margin:5px 0;}
select{border-radius:8px;padding:4px;}
</style>
</head>

<body>

<button id="night" style="position:fixed;top:10px;right:10px">🌙</button>

<header>
<h1>Guardias Alsi PRO</h1>
<div id="subtitle"></div>
</header>

<div class="nav">
<button id="prev">⬅</button>
<button id="next">➡</button>
</div>

<div class="container">
<div class="carousel" id="carousel"></div>
</div>

<details id="admin">
<summary>⚙️ Administrador</summary>

<h3>Eléctricos</h3>
<div id="admin-elec"></div>

<h3>Mecánicos</h3>
<div id="admin-mec"></div>

<button id="save">💾 Guardar</button>
</details>

<script>
// 🌙 modo noche
night.onclick=()=>{document.body.classList.toggle("dark");localStorage.dark=document.body.classList.contains("dark")}
if(localStorage.dark==="true")document.body.classList.add("dark");

// 🔐 admin por URL
if(new URLSearchParams(location.search).get("admin")!=="alsi2026")
 document.getElementById("admin").style.display="none";

// datos base
let electricos=["Abde","Fran","Dani","Jose","Fran Ruiz","Hicham"];
let mecanicos=["Ramon","Santy","Traian","Manu","Fran Alba","Cele"];
let estados=JSON.parse(localStorage.estados||"{}");
let offset=0;

// fechas
const lunes=d=>{d=new Date(d);let n=d.getDay();d.setDate(d.getDate()-(n===0?6:n-1));return d;}
const fd=d=>d.toLocaleDateString();

// solo activos
const activos=l=>l.filter(p=>!estados[p]||estados[p]==="activo");
const guardia=(l,o)=>{let a=activos(l);return a.length?a[((o%a.length)+a.length)%a.length]:"Nadie disponible";}

// render admin
function renderAdmin(){
 ["elec","mec"].forEach(t=>{
  let cont=document.getElementById("admin-"+t);
  cont.innerHTML="";
  (t==="elec"?electricos:mecanicos).forEach(p=>{
   cont.innerHTML+=`
   <div class="admin-person">
     ${p}
     <select onchange="estados['${p}']=this.value">
       <option value="activo" ${estados[p]==="activo"?"selected":""}>Activo</option>
       <option value="vacaciones" ${estados[p]==="vacaciones"?"selected":""}>Vacaciones</option>
       <option value="baja" ${estados[p]==="baja"?"selected":""}>Baja</option>
       <option value="viaje" ${estados[p]==="viaje"?"selected":""}>Viaje</option>
     </select>
   </div>`;
  });
 });
}

// render calendario
function render(){
 carousel.innerHTML="";
 let base=lunes(new Date());
 let ini=new Date(base);ini.setDate(ini.getDate()+offset*7);
 subtitle.textContent=`${fd(ini)} - ${fd(new Date(ini.getTime()+4*86400000))}`;
 for(let i=-1;i<=1;i++){
  let l=new Date(ini);l.setDate(l.getDate()+i*7);
  let v=new Date(l);v.setDate(v.getDate()+4);
  carousel.innerHTML+=`
  <div class="card">
    <h3>${fd(l)} - ${fd(v)}</h3>
    <div class="guardias">
      <div class="guardia"><div class="icono">⚡</div><div class="nombre">${guardia(electricos,offset+i)}</div></div>
      <div class="guardia"><div class="icono">🔧</div><div class="nombre">${guardia(mecanicos,offset+i)}</div></div>
    </div>
  </div>`;
 }
}

// botones
prev.onclick=()=>{offset--;render()}
next.onclick=()=>{offset++;render()}

// guardar
save.onclick=()=>{
 localStorage.estados=JSON.stringify(estados);
 render();
 alert("Guardado");
}

renderAdmin();
render();
</script>

</body>
</html>
