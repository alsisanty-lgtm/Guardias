<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardias Alsi PRO</title>

<link rel="manifest" href="/Guardias/manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="icon" href="/Guardias/icon-192.png">

<style>
:root{
  --primary:#1e88e5;
  --primary-dark:#1565c0;
  --bg:#f2f4f8;
  --text:#1f2937;
  --card:#ffffff;
  --muted:#6b7280;
  --shadow:0 10px 25px rgba(0,0,0,.12);
  --radius:18px;
}
body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:24px 16px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:var(--shadow);
}
header h1{margin:0;font-size:1.8em;font-weight:800;}
#subtitle{opacity:.9;margin-top:6px;font-size:.95em;}

button{
  border:none;
  border-radius:14px;
  padding:10px 18px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}

#night{
  position:fixed;
  top:12px;
  right:12px;
  z-index:200;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(6px);
}

.nav{
  display:flex;
  justify-content:space-between;
  padding:14px;
  gap:10px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:10px;
}

.carousel{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding-bottom:10px;
}

.card{
  min-width:300px;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  scroll-snap-align:center;
  animation:fade .3s ease;
}
@keyframes fade{from{opacity:.6;transform:scale(.98)}to{opacity:1}}

.card h3{
  margin-top:0;
  text-align:center;
  font-weight:800;
}

.guardias{
  display:flex;
  gap:14px;
  margin-top:15px;
}
.guardia{
  flex:1;
  text-align:center;
  background:rgba(0,0,0,.03);
  border-radius:14px;
  padding:14px;
}
body.dark .guardia{background:rgba(255,255,255,.05)}

.icono{font-size:2.4em}
.nombre{
  font-size:1.15em;
  font-weight:800;
  margin-top:6px;
}

details{
  margin:20px;
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
summary{
  font-weight:800;
  cursor:pointer;
}

.admin-person{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid rgba(0,0,0,.08);
}
.admin-person:last-child{border:none}

select{
  border-radius:10px;
  padding:6px 10px;
  border:1px solid rgba(0,0,0,.2);
}
</style>
</head>

<body>

<button id="night">🌙</button>

<header>
<h1>Guardias Alsi PRO</h1>
<div id="subtitle"></div>
</header>

<div class="nav">
<button id="prev">⬅ Anterior</button>
<button id="next">Siguiente ➡</button>
</div>

<div class="container">
<div class="carousel" id="carousel"></div>
</div>

<details id="admin">
<summary>⚙️ Administrador</summary>

<h3>⚡ Eléctricos</h3>
<div id="admin-elec"></div>

<h3>🔧 Mecánicos</h3>
<div id="admin-mec"></div>

<br>
<button id="save">💾 Guardar cambios</button>
</details>

<script>
// 🌙 modo noche
night.onclick=()=>{document.body.classList.toggle("dark");localStorage.dark=document.body.classList.contains("dark")}
if(localStorage.dark==="true")document.body.classList.add("dark");

// 🔐 admin por URL
if(new URLSearchParams(location.search).get("admin")!=="alsi2026")
 document.getElementById("admin").style.display="none";

// datos
let electricos=["Abde","Fran","Dani","Jose","Fran Ruiz","Hicham"];
let mecanicos=["Ramon","Santy","Traian","Manu","Fran Alba","Cele"];
let estados=JSON.parse(localStorage.estados||"{}");
let offset=0;

// fechas
const lunes=d=>{d=new Date(d);let n=d.getDay();d.setDate(d.getDate()-(n===0?6:n-1));return d;}
const fd=d=>d.toLocaleDateString();

// rotación
const activos=l=>l.filter(p=>!estados[p]||estados[p]==="activo");
const guardia=(l,o)=>{let a=activos(l);return a.length?a[((o%a.length)+a.length)%a.length]:"Nadie disponible";}

// admin
function renderAdmin(){
 ["elec","mec"].forEach(t=>{
  let cont=document.getElementById("admin-"+t);
  cont.innerHTML="";
  (t==="elec"?electricos:mecanicos).forEach(p=>{
   cont.innerHTML+=`
   <div class="admin-person">
     ${p}
     <select onchange="estados['${p}']=this.value">
       <option value="activo" ${estados[p]==="activo"?"selected":""}>Activo</option>
       <option value="vacaciones" ${estados[p]==="vacaciones"?"selected":""}>Vacaciones</option>
       <option value="baja" ${estados[p]==="baja"?"selected":""}>Baja</option>
       <option value="viaje" ${estados[p]==="viaje"?"selected":""}>Viaje</option>
     </select>
   </div>`;
  });
 });
}

// calendario
function render(){
 carousel.innerHTML="";
 let base=lunes(new Date());
 let ini=new Date(base);ini.setDate(ini.getDate()+offset*7);
 subtitle.textContent=`${fd(ini)} - ${fd(new Date(ini.getTime()+4*86400000))}`;
 for(let i=-1;i<=1;i++){
  let l=new Date(ini);l.setDate(l.getDate()+i*7);
  let v=new Date(l);v.setDate(v.getDate()+4);
  carousel.innerHTML+=`
  <div class="card">
    <h3>${fd(l)} - ${fd(v)}</h3>
    <div class="guardias">
      <div class="guardia"><div class="icono">⚡</div><div class="nombre">${guardia(electricos,offset+i)}</div></div>
      <div class="guardia"><div class="icono">🔧</div><div class="nombre">${guardia(mecanicos,offset+i)}</div></div>
    </div>
  </div>`;
 }
}

// eventos
prev.onclick=()=>{offset--;render()}
next.onclick=()=>{offset++;render()}
save.onclick=()=>{localStorage.estados=JSON.stringify(estados);render();alert("Cambios guardados")}

renderAdmin();
render();
</script>

</body>
</html>
