<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guardias Semanales - PRO</title>

<!-- ===== PWA CONFIGURACIÓN (CORRECTA PARA ANDROID) ===== -->
<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#007bff">

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- =================================================== -->

<style>
:root{
  --primary:#007bff; --secondary:#6c757d; --success:#28a745;
  --warning:#ffc107; --danger:#dc3545; --bg:#f5f6fa; --text:#333;
  --card-bg:#fff; --shadow:0 8px 25px rgba(0,0,0,0.15);
  --today:#ffea00;
}
body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
header{background: linear-gradient(135deg,var(--primary),#0056b3); color:#fff;text-align:center;padding:20px;position:sticky;top:0;z-index:100;}
h1{margin:0;font-size:1.8em;}
.subtitulo{font-size:1em;opacity:0.8;margin-top:5px;}
.container{max-width:900px;margin:20px auto;position:relative;overflow:hidden;}
.carousel{display:flex;transition:transform 0.5s ease;}
.card{min-width:300px;margin:0 10px;background:var(--card-bg);border-radius:20px;box-shadow:var(--shadow);padding:20px;position:relative;flex-shrink:0;transition:transform 0.3s;}
.card:hover{transform:scale(1.03);}
.card-header{font-weight:700;font-size:1.3em;text-align:center;margin-bottom:10px;}
.guardias{display:flex;justify-content:space-around;flex-wrap:wrap;gap:15px;}
.guardia{flex:1;min-width:120px;background:#fff;border-radius:15px;padding:15px;text-align:center;position:relative;}
.icono{font-size:2.8em;margin-bottom:10px;}
.dept{font-weight:600;opacity:0.8;}
.nombre{font-weight:700;margin:5px 0;font-size:1.2em;}
.duracion{font-weight:600;color:var(--primary);}
.indicator{position:absolute;top:5px;right:5px;padding:3px 8px;border-radius:15px;font-size:0.7em;font-weight:bold;color:#fff;}
.ind-actual{background:var(--warning);color:#212529;}
.days{display:flex;justify-content:space-between;margin-top:10px;}
.day{font-size:0.8em;padding:3px 5px;border-radius:5px;}
.today{background:var(--today);}
.nav-buttons{display:flex;justify-content:space-between;margin:10px 0;}
button{padding:8px 15px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;}
details{margin-top:15px;background:#fff;padding:15px;border-radius:15px;box-shadow:var(--shadow);}
textarea,input{width:100%;padding:8px;margin-top:8px;border-radius:10px;border:1px solid #ced4da;}
@media(max-width:600px){.guardias{flex-direction:column;}}
</style>
</head>

<body>

<header>
<h1>Guardias Semanales PRO</h1>
<div class="subtitulo" id="subtitulo-semana">Semana actual</div>
</header>

<div class="container">
  <div class="nav-buttons">
    <button id="prevWeek">⬅ Semana anterior</button>
    <button id="nextWeek">Semana siguiente ➡</button>
  </div>
  <div class="carousel" id="carouselArea"></div>
</div>

<details id="adminPanel">
<summary>⚙️ Panel Administrador</summary>
<textarea id="electricos">Fran, Abde, Dani, Hicham, Jose, Fran Ruiz</textarea>
<textarea id="mecanicos">Santy, Traian, Fran Alba, Manu, Ramon</textarea>
<input id="ausentes" placeholder="Ausentes">
<button id="guardarBtn">💾 Guardar</button>
</details>

<script>
let electricos=["Fran","Abde","Dani","Hicham","Jose","Fran Ruiz"];
let mecanicos=["Santy","Traian","Fran Alba","Manu","Ramon"];
let ausentes=[];
let weekOffset=0;

function obtenerLunes(d=new Date()){
  const day=d.getDay();
  const diff=day===0?d.getDate()-6:d.getDate()-day+1;
  return new Date(d.getFullYear(),d.getMonth(),diff);
}
function sumarDias(f,d){let r=new Date(f);r.setDate(r.getDate()+d);return r;}
function formatFecha(f){return f.toLocaleDateString();}
Date.prototype.getWeekNumber=function(){
  let d=new Date(this);d.setDate(d.getDate()+4-(d.getDay()||7));
  let y=new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-y)/86400000)+1)/7);
}
function obtenerGuardia(lista,semana){
  return lista[(semana-1)%lista.length];
}

function render(){
  const c=document.getElementById('carouselArea');
  c.innerHTML='';
  for(let i=-1;i<=1;i++){
    const lunes=sumarDias(obtenerLunes(),(weekOffset+i)*7);
    const viernes=sumarDias(lunes,4);
    const sem=lunes.getWeekNumber();
    c.innerHTML+=`
    <div class="card">
      <div class="card-header">${formatFecha(lunes)} - ${formatFecha(viernes)}</div>
      <div class="guardias">
        <div class="guardia">
          <div class="icono">⚡</div>
          <div class="nombre">${obtenerGuardia(electricos,sem)}</div>
          <div class="duracion">L-V</div>
        </div>
        <div class="guardia">
          <div class="icono">🔧</div>
          <div class="nombre">${obtenerGuardia(mecanicos,sem)}</div>
          <div class="duracion">L-V</div>
        </div>
      </div>
    </div>`;
  }
}
document.getElementById('prevWeek').onclick=()=>{weekOffset--;render();}
document.getElementById('nextWeek').onclick=()=>{weekOffset++;render();}
document.getElementById('guardarBtn').onclick=()=>{render();}
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js')
    .then(() => console.log('Service Worker registrado'));
}
</script>

</body>
</html>
